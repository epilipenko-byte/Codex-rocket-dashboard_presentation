<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocket Finance Dashboard — Edition 2</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
--bg:#0a0e17;--surface:rgba(17,24,39,.7);--surface2:#1a2332;
--border:#1e2d3d;--border-hover:rgba(34,211,238,.3);
--text:#e2e8f0;--text-muted:#64748b;--text-dim:rgba(100,116,139,.6);
--accent:#22d3ee;--accent-dim:rgba(34,211,238,.4);
--green:#34d399;--green-bg:rgba(52,211,153,.15);
--red:#f87171;--red-bg:rgba(248,113,113,.12);
--orange:#fb923c;--orange-bg:rgba(251,146,60,.12);
--yellow:#fbbf24;--purple:#a78bfa;--purple-bg:rgba(167,139,250,.12);
--cyan:#06b6d4;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:#000}
body{font-family:'Outfit',sans-serif;background:transparent;color:var(--text);min-height:100vh}
#grass-bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;border:none;pointer-events:none}
/* AUTH */
#auth{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 30% 20%,rgba(167,139,250,.04) 0%,transparent 60%),rgba(10,14,23,.82)}
.auth-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:380px;text-align:center}
.auth-box h2{font-family:'Outfit',sans-serif;font-weight:800;font-size:28px;color:var(--accent);margin-bottom:8px}
.auth-box p{font-size:12px;color:var(--text-dim);margin-bottom:24px;letter-spacing:1px}
.auth-box input{width:100%;padding:12px 16px;background:rgba(15,25,15,.6);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;outline:none;margin-bottom:14px}
.auth-box input:focus{border-color:var(--accent-dim)}
.auth-box button{width:100%;padding:12px;background:rgba(167,139,250,.2);border:1px solid var(--border-hover);border-radius:10px;color:var(--accent);font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:1px;text-transform:uppercase;transition:all .3s}
.auth-box button:hover{background:rgba(167,139,250,.35)}
.auth-err{color:var(--red);font-size:11px;margin-top:6px;display:none}
/* MAIN */
#app{position:relative;z-index:2;display:none;min-height:100vh}
.hdr{padding:18px 32px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100;background:rgba(10,14,23,.93)}
.hdr-left{display:flex;align-items:center;gap:14px}
.hdr h1{font-family:'Outfit',sans-serif;font-size:28px;font-weight:800;letter-spacing:-1px;display:flex;align-items:baseline;gap:4px}
.logo-rocket{color:#f87171}
.logo-dash{color:rgba(255,255,255,.4);font-size:28px;font-weight:300}
.hdr h1 em{font-style:italic;color:var(--text)}
.hdr .period-tag{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,.4);padding:4px 10px;border:1px solid var(--border);border-radius:6px;letter-spacing:1px}
.hdr-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{padding:7px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text-muted);font-family:'Outfit',sans-serif;font-size:10px;font-weight:500;cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:5px;white-space:nowrap;letter-spacing:.5px;text-transform:uppercase}
.btn:hover{border-color:var(--border-hover);color:var(--accent)}
.btn-glow{background:rgba(167,139,250,.15);border-color:rgba(167,139,250,.25);color:var(--accent)}
.btn-glow:hover{background:rgba(167,139,250,.3)}
.btn-live{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3);color:var(--green)}
.sel{padding:6px 10px;background:rgba(15,25,15,.6);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:10px;outline:none;cursor:pointer}
.sel:focus{border-color:var(--accent-dim)}
.status{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.status.offline{background:var(--red);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* TABS */
.tabs{display:flex;gap:1px;padding:0 32px;border-bottom:1px solid var(--border);background:rgba(10,14,23,.92);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 20px;font-size:14px;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .3s;white-space:nowrap;letter-spacing:.5px;text-transform:uppercase}
.tab:hover{color:var(--text)}
.tab.active{color:#22d3ee;border-bottom-color:#22d3ee;text-shadow:0 0 12px rgba(34,211,238,.3)}
/* CONTENT */
.content{padding:20px 32px 60px;background:linear-gradient(180deg,rgba(10,14,23,.7) 0%,rgba(10,14,23,.5) 50%,rgba(10,14,23,.7) 100%);border-radius:0}
.pane{display:none}.pane.active{display:block}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:rgba(10,14,23,.22);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;padding:16px 18px;transition:all .4s;position:relative;overflow:hidden}
.kpi:hover{border-color:var(--border-hover);background:var(--surface2);transform:translateY(-2px)}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent-dim);opacity:.4}
.kpi-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:8px}
.kpi-val{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;color:var(--text);margin-bottom:4px}
.kpi-sub{font-family:'JetBrains Mono',monospace;font-size:12px}
.up{color:var(--green)}.dn{color:var(--red)}.nt{color:var(--text-dim)}.wr{color:var(--orange)}
/* CHARTS */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px}
.card{background:rgba(10,14,23,.28);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:14px;padding:18px 20px;transition:border-color .3s;position:relative}
.card:hover{border-color:var(--border-hover)}
.card.full{grid-column:1/-1}
.card-title{font-family:'Outfit',sans-serif;font-weight:400;font-size:15px;margin-bottom:12px;color:var(--text);display:flex;align-items:center;gap:8px}
.card-title .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.cw{position:relative;height:250px}.cw.tall{height:300px}.cw.short{height:180px}
.e2-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:0}
.speaker-block{grid-column:1/-1;border:1px solid rgba(34,211,238,.24);background:rgba(10,22,24,.42);border-radius:14px;overflow:hidden;margin:12px 0 18px;backdrop-filter:blur(18px)}
.speaker-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(34,211,238,.14)}
.speaker-head strong{font-size:13px;color:rgba(210,252,248,.92)}
.speaker-head span{font-size:10px;color:var(--text-dim)}
.speaker-block.collapsed .speaker-body{display:none}
.speaker-body textarea{width:100%;min-height:128px;resize:vertical;border:0;background:rgba(3,8,12,.58);color:var(--text);font:500 13px/1.55 'Outfit',sans-serif;padding:14px;outline:none}
.speaker-actions{display:flex;justify-content:flex-end;gap:8px;padding:8px 10px;border-top:1px solid rgba(34,211,238,.12)}
.speaker-actions button{height:30px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);font-size:11px;font-weight:700;padding:0 10px;cursor:pointer}
.speaker-actions .save{background:var(--accent);color:#031216;border-color:var(--accent)}
.link-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.dash-link-card{border:1px solid rgba(34,211,238,.24);background:rgba(10,28,31,.48);border-radius:14px;padding:16px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between}
.dash-link-card h4{font-size:17px;margin-bottom:8px}
.dash-link-card p{font-size:12px;color:var(--text-muted);line-height:1.55;margin-bottom:14px}
.dash-link-card a{display:flex;align-items:center;justify-content:center;height:36px;border-radius:8px;background:var(--accent);color:#041217;text-decoration:none;font-weight:800}
.tree-table .lvl1 td:first-child{padding-left:24px}.tree-table .lvl2 td:first-child{padding-left:42px;color:var(--text-muted)}
.tree-toggle{display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:5px;margin-right:6px;cursor:pointer;color:var(--accent)}
.hidden-row{display:none}
.tech-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tech-note{font-size:11px;color:var(--text-muted);line-height:1.55}
/* TABLES */
.tw{overflow-x:auto;margin-top:8px}
table.dt{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:10px}
table.dt th{background:rgba(15,25,15,.6);color:var(--text-dim);font-weight:500;text-align:right;padding:7px 10px;border-bottom:1px solid var(--border);font-size:9px;text-transform:uppercase;letter-spacing:.5px}
table.dt th:first-child{text-align:left}
table.dt td{padding:6px 10px;text-align:right;border-bottom:1px solid rgba(167,139,250,.06)}
table.dt td:first-child{text-align:left;font-family:'Outfit',sans-serif;font-weight:400;color:var(--text)}
table.dt tr.tot td{font-weight:700;border-top:2px solid var(--border);padding-top:8px}
table.dt tr:hover td{background:rgba(167,139,250,.03)}
/* ANALYSIS */
.asec{background:rgba(10,14,23,.22);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;padding:24px 28px;margin-bottom:16px}
.asec h3{font-family:'Outfit',sans-serif;font-weight:400;font-size:18px;margin-bottom:14px;color:var(--text)}
.finding{margin-bottom:16px;padding-left:0}
.finding-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);margin-right:6px}
.finding p{font-size:13px;line-height:1.7;color:var(--text);opacity:.85;margin-top:4px}
.finding .basis{font-size:10px;color:var(--text-dim);margin-top:4px;padding:4px 8px;background:rgba(15,25,15,.5);border:1px solid var(--border);border-radius:4px;display:inline-block;font-family:'JetBrains Mono',monospace}
.rtag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:600;font-family:'JetBrains Mono',monospace}
.rtag.hi{background:var(--red-bg);color:var(--red)}
.rtag.md{background:var(--orange-bg);color:var(--orange)}
.rtag.lo{background:var(--green-bg);color:var(--green)}
.rec{background:rgba(15,25,15,.5);border-left:3px solid var(--accent-dim);padding:14px 18px;margin-bottom:10px;border-radius:0 10px 10px 0;transition:border-color .3s}
.rec:hover{border-left-color:var(--accent)}
.rec h4{font-size:13px;font-weight:500;margin-bottom:3px;color:var(--text)}
.rec p{font-size:12px;color:var(--text-muted);margin:0}
.rec.urg{border-left-color:var(--red)}.rec.imp{border-left-color:var(--orange)}.rec.str{border-left-color:var(--purple)}
/* THRESHOLD */
.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:10px}
.th-item{background:rgba(15,25,15,.5);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px;border-left:3px solid var(--border);transition:all .3s}
.th-item:hover{background:rgba(20,35,20,.5)}
.th-item.alert{border-left-color:var(--red)}.th-item.warning{border-left-color:var(--orange)}.th-item.ok{border-left-color:var(--green)}
.th-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.th-item.alert .th-dot{background:var(--red)}.th-item.warning .th-dot{background:var(--orange)}.th-item.ok .th-dot{background:var(--green)}
.th-lbl{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px}
.th-txt{font-size:11px}
/* NOTES */
.note-btn{position:absolute;top:8px;right:10px;background:rgba(15,25,15,.6);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:10px;color:var(--text-dim);cursor:pointer;z-index:2;transition:all .2s}
.note-btn:hover{border-color:var(--accent-dim);color:var(--accent)}
.note-panel{display:none;position:absolute;top:30px;right:0;background:rgba(8,16,8,.95);border:1px solid var(--border);border-radius:10px;padding:12px 14px;width:300px;z-index:20;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.note-panel.open{display:block}
.note-entry{background:rgba(15,25,15,.5);border-radius:6px;padding:8px;margin-bottom:6px;border-left:2px solid var(--accent-dim)}
.note-form{display:flex;gap:6px;margin-top:8px}
.note-input{flex:1;padding:6px 8px;background:rgba(15,25,15,.6);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px;outline:none}
.note-submit{padding:6px 10px;background:rgba(167,139,250,.2);border:1px solid var(--border-hover);border-radius:6px;color:var(--accent);font-size:10px;font-weight:600;cursor:pointer}
/* DATA SOURCE BADGE */
.ds-badge{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--text-dim);background:rgba(15,25,15,.5);border:1px solid var(--border);border-radius:4px;padding:3px 8px;margin-bottom:10px}
.ds-badge.live{color:var(--green);border-color:rgba(52,211,153,.2)}
.ds-badge.demo{color:var(--orange);border-color:rgba(251,146,60,.2)}
/* RAW TABLE */
.raw-table-wrap{overflow-x:auto;max-height:400px;overflow-y:auto}
.raw-table-wrap table.dt{font-size:9px}
.ckp-block{display:grid;grid-template-columns:minmax(280px,1.1fr) minmax(260px,.9fr);gap:14px;margin:14px 0;padding:14px;border:1px solid var(--border);border-radius:8px;background:rgba(15,25,15,.36)}
.ckp-text h3{margin-bottom:10px}
.ckp-chart{min-height:220px}
.ckp-chart canvas{width:100%;height:220px}
/* PAYMENT CALENDAR */
.pay-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:rgba(15,25,15,.4);margin-bottom:6px;border-left:3px solid var(--border)}
.pay-row.pay-out{border-left-color:var(--red)}
.pay-row.pay-in{border-left-color:var(--green)}
.pay-row.pay-plan{border-left-color:var(--orange)}
.pay-date{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);min-width:60px}
.pay-name{font-size:12px;flex:1}
.pay-amt{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}
/* TASK STATUS */
.task-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:rgba(15,25,15,.4);margin-bottom:6px}
.task-status{font-size:9px;padding:2px 8px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-weight:600;white-space:nowrap}
.task-status.done{background:var(--green-bg);color:var(--green)}
.task-status.wip{background:var(--orange-bg);color:var(--orange)}
.task-status.late{background:var(--red-bg);color:var(--red)}
.task-status.todo{background:rgba(100,116,139,.1);color:var(--text-muted)}
/* LOADING */
.ld-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(8px)}
.ld-overlay.on{display:flex}
.spinner{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
/* PROGRESS */
.pbar{position:fixed;top:0;left:0;height:2px;background:var(--accent-dim);z-index:200;width:0;transition:width .3s}
/* REVEAL */
[data-reveal]{opacity:0;transform:translateY(20px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)}
[data-reveal].revealed{opacity:1;transform:translateY(0)}
/* RESPONSIVE */
@media(max-width:900px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.content{padding:14px 16px 40px}.hdr{padding:12px 16px 8px}.kpi-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.e2-row,.tech-grid,.ckp-block{grid-template-columns:1fr}}
@media(max-width:500px){.kpi-row{grid-template-columns:1fr 1fr}.tabs{padding:0 12px}.hdr h1{font-size:16px}}
</style>
</head>
<body>
<iframe id="grass-bg" src="grass_bg.html"></iframe>
<div class="pbar" id="pbar"></div>
<!-- AUTH -->
<div id="auth">
<div class="auth-box">
<h2>Rocket</h2>
<p>Live Financial Dashboard</p>
<input type="password" id="pwd" placeholder="Пароль" onkeydown="if(event.key==='Enter')login()">
<button onclick="login()">Войти</button>
<div class="auth-err" id="aerr">Неверный пароль</div>
</div>
</div>
<!-- LOADING -->
<div class="ld-overlay" id="ld"><div><div class="spinner"></div><div style="color:var(--text-dim);font-size:13px;text-align:center" id="ld-txt">Загрузка...</div></div></div>
<!-- APP -->
<div id="app">
<div class="hdr">
<div class="hdr-left">
<h1><span class="logo-rocket">Rocket</span> <span class="logo-dash">— Финансовый анализ</span></h1>
<span class="period-tag" id="ptag">YTD 2026</span>
</div>
<div class="hdr-actions">
<span style="font-size:10px;color:var(--text-dim);margin-right:4px">с</span>
<select class="sel" id="pFrom" onchange="onPeriod()" style="width:90px">
<option value="0" selected>Январь</option>
<option value="1">Февраль</option>
<option value="2">Март</option>
<option value="3">Апрель</option>
<option value="4">Май</option>
</select>
<span style="font-size:10px;color:var(--text-dim);margin:0 4px">по</span>
<select class="sel" id="pTo" onchange="onPeriod()" style="width:90px">
<option value="0">Январь</option>
<option value="1">Февраль</option>
<option value="2">Март</option>
<option value="3">Апрель</option>
<option value="4" selected>Май</option>
</select>
<button class="btn btn-live" onclick="fetchData()">↻ Обновить данные</button>
<button class="btn" onclick="fetchAI()">⚡ AI Анализ</button>
<button class="btn btn-glow" onclick="downloadReport()">⬇ Скачать</button>
<span class="status" id="live-dot" title="Live"></span>
<span id="updated-at" style="font-size:9px;color:var(--text-dim);font-family:'JetBrains Mono',monospace"></span>
</div>
</div>
<div class="tabs" id="tabbar"></div>
<div class="content" id="main"></div>
</div>

<script>
// ===== CONFIG =====
// DATA_PROXY_URL: вставьте URL вашего Google Apps Script Web App
// Получить: Расширения → Apps Script → Развернуть → Веб-приложение → Скопировать URL
const C={
  DATA_PROXY:'https://script.google.com/macros/s/AKfycbxKamFtHfX6VZZE2OcVkaPgHHygP8Ck0Pt9SrLYZeBHXDQi5Qqi-rU5dchVw2opZkAq/exec',   // Apps Script Web App Edition 2 JSONP
  AI:'WEBHOOK_AI_ANALYSIS_URL',               // ← Make.com AI Analysis webhook (опционально)
  TOOLS:'https://script.google.com/macros/s/AKfycbwxYcEODuv8V9XIuXpyJ6giQOE8pXpHZITkznxqzTSuLef4HYlY1eHdwaBOvAvO8Sbh/exec',
  PWD_HASH:'5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8',
  DEMO: false   // LIVE mode — Apps Script deployed 01.06.2026
};

// ===== AUTH =====
async function login(){const h=await sha(document.getElementById('pwd').value);if(h===C.PWD_HASH||C.DEMO){document.getElementById('auth').style.display='none';document.getElementById('app').style.display='block';init()}else{document.getElementById('aerr').style.display='block'}}
async function sha(m){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(m));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

// ===== TABS =====
const TABS=[
{id:'overview',label:'Обзор месяца',v:true},

function parseRuDate(v){
  if(v instanceof Date&&!isNaN(v))return v;
  const s=String(v||'').trim();
  const m=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);
  if(!m)return null;
  const y=+m[3]<100?2000+(+m[3]):+m[3];
  const d=new Date(y,+m[2]-1,+m[1]);
  return isNaN(d)?null:d;
}
const MONTH_SHORT=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const MONTH_LONG=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function monthIndex(m){
  const s=String(m||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]/g,'');
  if(!s)return -1;
  const num=parseInt(s,10);
  if(Number.isFinite(num)&&num>=1&&num<=12)return num-1;
  return ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'].findIndex(x=>s.startsWith(x));
}
function monthOrder(months){
  const seen=new Set(),items=[];
  (months||[]).forEach((m,old)=>{
    const idx=monthIndex(m);
    if(idx>=0&&!seen.has(idx)){seen.add(idx);items.push({old,idx})}
  });
  return items.sort((a,b)=>a.idx-b.idx);
}
function sanitizeMonths(months){
  const out=monthOrder(months).map(m=>MONTH_SHORT[m.idx]);
  return out.length?out:MONTH_SHORT.slice();
}
function parseMonthKey(key,label,old){
  const s=String(key||'').trim();
  const m=s.match(/^(\d{4})-(\d{1,2})/);
  if(m){
    const idx=+m[2]-1;
    if(idx>=0&&idx<12)return{old,idx,key:`${m[1]}-${String(+m[2]).padStart(2,'0')}`,label:MONTH_SHORT[idx],year:+m[1]};
  }
  const idx=monthIndex(label);
  return idx>=0?{old,idx,key:'legacy-'+old,label:MONTH_SHORT[idx],year:null}:null;
}
function usefulAt(d,pos,fields){
  return fields.some(f=>Array.isArray(d[f])&&Number.isFinite(+d[f][pos])&&Math.abs(+d[f][pos])>0.000001);
}
function buildSourceTimeline(d){
  const months=Array.isArray(d.months)?d.months:[];
  const keys=Array.isArray(d.month_keys)?d.month_keys:[];
  if(keys.length&&keys.length===months.length){
    const seen=new Set(),items=[];
    months.forEach((label,old)=>{
      const item=parseMonthKey(keys[old],label,old);
      if(!item||seen.has(item.key))return;
      seen.add(item.key);items.push(item);
    });
    let filtered=items;
    if(items.length>12){
      const yearCounts={};
      items.forEach(i=>{if(i.year)yearCounts[i.year]=(yearCounts[i.year]||0)+1});
      const year=Object.keys(yearCounts).sort((a,b)=>yearCounts[b]-yearCounts[a])[0];
      const sameYear=items.filter(i=>String(i.year)===String(year));
      if(sameYear.length>=2)filtered=sameYear;
    }
    return filtered.sort((a,b)=>a.key.localeCompare(b.key));
  }
  const seen=new Set(),items=[];
  months.forEach((label,old)=>{
    const idx=monthIndex(label);
    if(idx<0||seen.has(idx))return;
    // Старый proxy иногда отдает "Дек, Янв, Фев..." — первый Дек относится к прошлому году.
    if(old===0&&idx===11&&monthIndex(months[1])===0)return;
    seen.add(idx);
    const year=D.year||d.year||2026;
    items.push({old,idx,label:MONTH_SHORT[idx],key:`${year}-${String(idx+1).padStart(2,'0')}`,year});
  });
  return items.sort((a,b)=>a.idx-b.idx);
}

function usefulSeries(a){return Array.isArray(a)&&a.some(v=>Number.isFinite(+v)&&Math.abs(+v)>0.000001)}
function normalizeData(){
  const n=Math.max(1,(D.months||[]).length);
  const hadMargin=usefulSeries(D.margin_pct),hadGross=usefulSeries(D.gross_margin_pct),hadOp=usefulSeries(D.op_margin_pct),hadNp=usefulSeries(D.np_margin_pct);
  DATA_FIELDS.forEach(f=>{
    if(!Array.isArray(D[f]))D[f]=[];
    D[f]=D[f].slice(0,n).map(v=>+v||0);
    if(COST_FIELDS.includes(f))D[f]=D[f].map(v=>Math.abs(v));
    if(PERCENT_FIELDS.includes(f)&&D[f].some(v=>Math.abs(v)>0.000001)&&Math.max(...D[f].map(v=>Math.abs(v)))<=1.5){
      D[f]=D[f].map(v=>+(v*100).toFixed(2));
    }
    while(D[f].length<n)D[f].push(0);
  });
  if(!hadGross&&D.revenue.some(v=>v>0)&&D.var_costs.some(v=>v>0)){
    D.gross_margin_pct=D.revenue.map((r,i)=>r?+(((r-D.var_costs[i])/r)*100).toFixed(2):0);
  }
  if(!hadMargin)D.margin_pct=D.gross_margin_pct.slice();
  if(!hadOp&&D.revenue.some(v=>v>0)&&D.op_profit.some(v=>v!==0)){
    D.op_margin_pct=D.revenue.map((r,i)=>r?+((D.op_profit[i]/r)*100).toFixed(2):0);
  }
  if(!hadNp&&D.revenue.some(v=>v>0)&&D.net_profit.some(v=>v!==0)){
    D.np_margin_pct=D.revenue.map((r,i)=>r?+((D.net_profit[i]/r)*100).toFixed(2):0);
  }
}
function hasDuplicateMonths(months){
  const seen=new Set();
  for(const m of months||[]){
    const idx=monthIndex(m);
    if(idx<0)continue;
    if(seen.has(idx))return true;
    seen.add(idx);
  }
  return false;
}
function remapDataToTimeline(source,timeline){
  if(!timeline.length)return false;
  DATA_FIELDS.forEach(f=>{
    if(Array.isArray(source[f]))source[f]=timeline.map(m=>+source[f][m.old]||0);
  });
  source.months=timeline.map(m=>m.label);
  source.month_keys=timeline.map(m=>m.key);
  return true;
}
function migrateCachedData(){
  if(!Array.isArray(D.months)||!D.months.length)return;
  if(Array.isArray(D.month_keys)&&D.month_keys.length===D.months.length&&!hasDuplicateMonths(D.months))return;
  const timeline=buildSourceTimeline(D);
  if(remapDataToTimeline(D,timeline)){
    localStorage.setItem('rocket_data',JSON.stringify(D));
  }
}

      });
      if(sourceTimeline.length&&acceptedFields>0){D.months=sourceTimeline.map(m=>m.label);D.month_keys=sourceTimeline.map(m=>m.key);}
      else if(Array.isArray(d.months)&&d.months.length>0&&acceptedFields>0)D.months=sanitizeMonths(d.months);

      if(d.model_data)D.model_data=d.model_data;
      if(d.payment_data)D.payment_data=d.payment_data;
      if(d.tasks_data)D.tasks_data=d.tasks_data;
      if(d.ckp_data)D.ckp_data=d.ckp_data;
      if(d.report_matches)D.report_matches=d.report_matches;
      if(d.report_errors)D.report_errors=d.report_errors;
      dataSource=acceptedFields>0?'live':'cache';
      // Обновить период-селекторы если месяцев больше
      if(Array.isArray(D.months)&&D.months.length>0)updatePeriodSelectors();
      localStorage.setItem('rocket_data',JSON.stringify(D));
      localStorage.setItem('rocket_updated',new Date().toISOString());
      document.getElementById('live-dot').classList.toggle('offline',acceptedFields===0);
      setStatus((acceptedFields>0?'обновлено ':'получены только сырые данные ')+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}));
    }else{
      console.warn('Apps Script returned error:',d.error);
      dataSource='reserve';
      document.getElementById('live-dot').classList.add('offline');
      setStatus('⚠ proxy: '+String(d&&d.error||'ошибка').slice(0,70));
    }
  }catch(e){
    console.warn('Apps Script unavailable, using cached/reserve data:',e);
    dataSource=dataSource==='cache'?'cache':'reserve';
    document.getElementById('live-dot').classList.add('offline');
    setStatus('⚠ '+humanLoadError(e));
  }
  normalizeData();
  try{render()}finally{hide()}
}

function humanLoadError(e){
  const msg=String(e&&e.message||e||'ошибка загрузки');
  if(msg.includes('<!DOCTYPE')||msg.includes('HTML'))return 'proxy вернул HTML, нужен deploy Apps Script';
  if(msg.includes('aborted')||msg.includes('Abort'))return 'proxy не ответил вовремя';
  return 'ошибка загрузки ('+msg.slice(0,60)+')';
}
async function fetchProxyJson(baseUrl){
  try{
    return await fetchProxyJsonp(baseUrl+'?action=get_all&_='+Date.now());
  }catch(jsonpErr){
    console.warn('JSONP proxy load failed, trying fetch:',jsonpErr);
  }
  const attempts=[
    baseUrl+'?action=get_all&_='+Date.now(),
    baseUrl+'?_='+Date.now()
  ];
  let lastErr=null;
  for(const requestUrl of attempts){
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),75000);
    try{
      const r=await fetch(requestUrl,{method:'GET',cache:'no-store',signal:controller.signal});
      const text=await r.text();
      if(!r.ok)throw new Error('HTTP '+r.status+' '+text.slice(0,120));
      const trimmed=text.trim();
      if(trimmed.startsWith('<'))throw new Error('HTML response: '+trimmed.slice(0,80));
      return JSON.parse(trimmed);
    }catch(err){
      lastErr=err;
    }finally{
      clearTimeout(timeout);
    }
  }
  throw lastErr||new Error('proxy unavailable');
}
function fetchProxyJsonp(requestUrl){
  return new Promise((resolve,reject)=>{
    const callback='__rocketProxyCb_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    const sep=requestUrl.includes('?')?'&':'?';
    const script=document.createElement('script');
    const timeout=setTimeout(()=>{
      cleanup();
      reject(new Error('JSONP timeout'));
    },75000);
    function cleanup(){
      clearTimeout(timeout);
      try{delete window[callback]}catch(e){window[callback]=undefined}
      if(script.parentNode)script.parentNode.removeChild(script);
    }
    window[callback]=data=>{cleanup();resolve(data)};
    script.onerror=()=>{cleanup();reject(new Error('JSONP load error'))};
    script.src=requestUrl+sep+'callback='+encodeURIComponent(callback);
    document.head.appendChild(script);
  });
}

function defaultUsefulRange(){
  // Cash is a balance snapshot and may be copied into future months; do not let it extend the default period.
  const fields=['revenue','net_profit','op_profit','total_ncf'];
  const idxs=[];
  for(let i=0;i<(D.months||[]).length;i++){
    if(fields.some(f=>Array.isArray(D[f])&&Number.isFinite(+D[f][i])&&Math.abs(+D[f][i])>0.000001))idxs.push(i);
  }
  if(!idxs.length)return{from:0,to:Math.max(0,(D.months||[]).length-1)};
  return{from:idxs[0],to:idxs[idxs.length-1]};
}

function toggleNote(id,e){e.stopPropagation();document.querySelectorAll('.note-panel.open').forEach(p=>{if(p.id!==id)p.classList.remove('open')});document.getElementById(id).classList.toggle('open')}
function addNote(cid){
  const inp=document.getElementById('ni-'+cid),txt=inp.value.trim();
  if(!txt)return;
  const note={chart_id:cid,month:new Date().toISOString().slice(0,7),text:txt};
  D.notes.push(note);inp.value='';
  if(!C.DEMO&&C.DATA_PROXY!=='APPS_SCRIPT_URL_PLACEHOLDER'){
    fetch(C.DATA_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'add_note',note})}).catch(()=>{});
  }
  render();
}
document.addEventListener('click',e=>{if(!e.target.closest('.note-panel')&&!e.target.closest('.note-btn'))document.querySelectorAll('.note-panel.open').forEach(p=>p.classList.remove('open'))});

// ===== DATA SOURCE BADGE =====
function dsBadge(src){
  const map={
    live:['live','● LIVE — Google Sheets'],
    cache:['live','◐ КЭШ — Google Sheets'],
    loading:['live','◌ Загрузка Google Sheets'],
    reserve:['demo','○ РЕЗЕРВ — ждёт Google Sheets']
  };
  const b=map[src]||map.loading;
  return `<div class="ds-badge ${b[0]}">${b[1]}</div>`;
}

// ===== INIT =====
function init(){
  try{
    const saved=localStorage.getItem('rocket_data');
    if(saved){Object.assign(D,JSON.parse(saved));dataSource='cache'}
    migrateCachedData();
    const upd=localStorage.getItem('rocket_updated');
    if(upd){const el=document.getElementById('updated-at');if(el)el.textContent='кэш '+new Date(upd).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
  }catch(e){}
  buildTabs();updatePeriodSelectors();render();
  if(!C.DEMO&&C.DATA_PROXY!=='APPS_SCRIPT_URL_PLACEHOLDER')fetchData();
}

// ===== RENDER ALL =====
function render(){
  normalizeData();
  document.getElementById('ptag').textContent=plbl();
  renderOverview();renderPnL();renderPnLCombo();renderPnLConsol();renderModel();
  renderCF();renderBalance();renderPayment();renderTraffic();renderCKP();
  renderResults();renderConclusions();renderTech();
  document.querySelectorAll('[data-reveal]:not(.revealed)').forEach(el=>{
    const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){el.classList.add('revealed');obs.unobserve(el)}})},{threshold:.1});
    obs.observe(el);
  });
}

function paymentSummary(){
  const target=(D.months[li()]||'').toLowerCase();
  const out={planIn:0,factIn:0,planOut:0,factOut:0};
  const rows=Array.isArray(D.payment_data)?D.payment_data:[];
  if(rows.length<2)return out;
  const headerIdx=findTableHeader(rows,[['месяц','month'],['сумма','usd','amount'],['факт','fact']],1);
  const hdr=(rows[headerIdx]||[]).map(h=>String(h||'').toLowerCase());
  const ci=(names)=>{for(const n of names){const i=hdr.findIndex(h=>h.includes(n));if(i>=0)return i;}return-1};
  const iMonth=ci(['месяц','month']);
  const iAmount=ci(['сумма','usd','amount']);
  const iFact=ci(['факт','fact']);
  rows.slice(headerIdx+1).forEach(r=>{
    const m=String(iMonth>=0?r[iMonth]:'').toLowerCase();
    if(target&&m&&!m.includes(target))return;
    const amount=parseRuNumber(iAmount>=0?r[iAmount]:0);
    if(!Number.isFinite(amount))return;
    const factVal=iFact>=0?String(r[iFact]||'').toLowerCase():'';
    const isFact=factVal==='true'||factVal==='да'||factVal==='1'||factVal.includes('факт');
    if(amount>=0){out.planIn+=amount;if(isFact)out.factIn+=amount}
    else{out.planOut+=Math.abs(amount);if(isFact)out.factOut+=Math.abs(amount)}
  });
  return out;
}

function ckpBlocks(data){
  const headerIdx=findTableHeader(data,[['цкп','ckp','название','показатель'],['знач','value','план','факт']],1);
  const rows=data.slice(headerIdx+1).filter(r=>r&&r.some(c=>c!==''&&c!==null&&c!==undefined));
  const blocks=[];
  let current=null;
  rows.slice(0,120).forEach((r,idx)=>{
    const first=String(r[0]??r[1]??'').trim();
    if(!first)return;
    const isTitle=/цкп|цель|objective|key result/i.test(first)||(!parseRuNumber(first)&&r.slice(1).filter(c=>String(c||'').trim()).length<=2&&idx>0);
    if(isTitle||!current){
      current={title:first||('ЦКП '+(blocks.length+1)),rows:[]};
      blocks.push(current);
    }else{
      const label=first;
      const val=r.slice(1).find(c=>String(c??'').trim()!=='')??'';
      current.rows.push({label,value:val});
    }
  });
  return blocks.filter(b=>b.rows.length).slice(0,12);
}

// ===== TASKS =====
function findTableHeader(rows, groups, minScore=2){
  let best={idx:0,score:-1};
  (rows||[]).forEach((row,idx)=>{
    const hdr=(row||[]).map(h=>String(h||'').toLowerCase().trim());
    let score=0;
    groups.forEach(names=>{if(names.some(n=>hdr.some(h=>h.includes(n))))score++});
    if(score>best.score)best={idx,score};
  });
  return best.score>=minScore?best.idx:0;
}
function renderTasks(){
  let html=`<div class="asec" data-reveal><h3>✅ Свод по задачам</h3>`;
  if(D.tasks_data&&Array.isArray(D.tasks_data)&&D.tasks_data.length>1){
    const rows=D.tasks_data;
    const headerIdx=findTableHeader(rows,[
      ['задач','наименов','название','task','name'],
      ['статус','status','состо'],
      ['ответств','owner','исполн','сотрудн'],
      ['срок','дедлайн','deadline','план','дата план']
    ]);
    // Ищем индексы по НАЗВАНИЮ заголовка, а не по позиции (защита от перестановки столбцов и служебных строк сверху)
    const hdr=rows[headerIdx].map(h=>String(h||'').toLowerCase().trim());
    const ci=(names)=>{for(const n of names){const i=hdr.findIndex(h=>h.includes(n));if(i>=0)return i;}return-1};
    const iName=ci(['задач','наименов','название','task','name']);
    const iStat=ci(['статус','status','состо']);
    const iOwn=ci(['ответств','owner','исполн','сотрудн']);
    const iDead=ci(['дата план','срок','дедлайн','deadline','план']);
    const iFact=ci(['дата факт','факт']);
    const dataRows=rows.slice(headerIdx+1).filter(r=>{
      const name=(iName>=0?r[iName]:r[0]);
      return String(name||'').trim()&&r.some(c=>c!==''&&c!==null&&c!==undefined);
    });
    html+=`<div style="margin-bottom:12px">`;
    dataRows.slice(0,50).forEach(r=>{
      const name=(iName>=0?r[iName]:r[0])||'—';
      const rawSt=String(iStat>=0?r[iStat]:r[2]||'').toLowerCase();
      let cls='todo',lbl='Не начато';
      if(rawSt.includes('выполн')||rawSt.includes('done')||rawSt.includes('завер')||rawSt.includes('готов'))cls='done',lbl='Выполнено';
      else if(rawSt.includes('работ')||rawSt.includes('wip')||rawSt.includes('прогресс')||rawSt.includes('в процесс'))cls='wip',lbl='В работе';
      else if(rawSt.includes('просроч')||rawSt.includes('late')||rawSt.includes('задерж')||rawSt.includes('перенос'))cls='late',lbl='Просрочено';
      else if(iDead>=0&&!r[iFact]&&parseRuDate(r[iDead])&&parseRuDate(r[iDead])<new Date())cls='late',lbl='Просрочено';
      const owner=iOwn>=0?r[iOwn]:'';
      const dead=iDead>=0?r[iDead]:'';
      html+=`<div class="task-item"><span class="task-status ${cls}">${lbl}</span><span class="pay-name">${name}</span>${owner?`<span style="font-size:10px;color:var(--text-dim);margin-left:8px">${owner}</span>`:''}${dead?`<span style="font-size:10px;color:var(--accent-dim);margin-left:8px">${dead}</span>`:''}</div>`;
    });
    if(dataRows.length>50)html+=`<p style="font-size:10px;color:var(--text-dim);margin-top:8px">...и ещё ${dataRows.length-50} задач</p>`;
    html+=`</div>`;
    // Сводная диаграмма статусов
    const stats={done:0,wip:0,late:0,todo:0};
    dataRows.forEach(r=>{const s=String(iStat>=0?r[iStat]:r[2]||'').toLowerCase();if(s.includes('выполн')||s.includes('done')||s.includes('завер')||s.includes('готов'))stats.done++;else if(s.includes('просроч')||s.includes('late')||(iDead>=0&&!r[iFact]&&parseRuDate(r[iDead])&&parseRuDate(r[iDead])<new Date()))stats.late++;else if(s.includes('работ')||s.includes('wip')||s.includes('прогресс'))stats.wip++;else stats.todo++;});
    html+=`</div><div class="card" style="max-width:360px;margin-top:16px" data-reveal><div class="card-title"><span class="dot" style="background:var(--green)"></span>Статусы задач</div><div class="cw short"><canvas id="c-tasks-status"></canvas></div></div>`;
    document.getElementById('p-tasks').innerHTML=html;
    mc('c-tasks-status',{type:'doughnut',data:{labels:['Выполнено '+stats.done,'В работе '+stats.wip,'Просрочено '+stats.late,'Не начато '+stats.todo],datasets:[{data:[stats.done,stats.wip,stats.late,stats.todo],backgroundColor:['rgba(52,211,153,.5)','rgba(251,146,60,.5)','rgba(248,113,113,.5)','rgba(100,116,139,.3)'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:10}}}},cutout:'50%'}});
    return;
  } else {
    html+=`<p style="color:var(--text-dim);font-size:12px">Источник: Дорожная карта Rocket Project 2026 — лист «свод по задачам».<br>Статусы: выполнено / в работе / просрочено / не начато.</p>`;
  }
  html+=`</div>`;
  document.getElementById('p-tasks').innerHTML=html;
}

// ===== HELPER: RENDER RAW TABLE FROM 2D ARRAY =====
function esc(v){
  return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function renderRawTable(data,id,headerGroups){
  if(!data||!data.length)return'';
  const headerIdx=headerGroups?findTableHeader(data,headerGroups,1):0;
  const headers=data[headerIdx];
  const rows=data.slice(headerIdx+1).filter(r=>r.some(c=>c!==''&&c!==null&&c!==undefined));
  if(!rows.length)return'<p style="color:var(--text-dim);font-size:11px">Нет данных</p>';
  let html=`<div class="raw-table-wrap"><table class="dt" id="${id}"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>`;
  rows.slice(0,100).forEach(r=>{
    html+=`<tr>${headers.map((_,ci)=>{
      const v=r[ci];
      if(v===null||v===undefined||v==='')return`<td></td>`;
      const n=parseFloat(v);
      if(!isNaN(n)&&v!==''){
        const cls=n<0?'dn':n>0?'':'nt';
        return`<td class="${cls}">${typeof v==='number'?v.toLocaleString('ru-RU'):esc(v)}</td>`;
      }
      return`<td>${esc(v)}</td>`;
    }).join('')}</tr>`;
  });
  if(rows.length>100)html+=`<tr><td colspan="${headers.length}" style="color:var(--text-dim);text-align:center">...и ещё ${rows.length-100} строк</td></tr>`;
  html+=`</tbody></table></div>`;
  return html;
}
function rawTableToExpandable(data,id,headerGroups){
  if(!data||!data.length)return'';
  const headerIdx=headerGroups?findTableHeader(data,headerGroups,1):0;
  const headers=(data[headerIdx]||[]).map(h=>String(h||'').trim());
  const rows=data.slice(headerIdx+1).filter(r=>r&&r.some(c=>c!==''&&c!==null&&c!==undefined));
  if(!rows.length)return'<p class="tech-note">Нет данных</p>';
  const maxCols=Math.min(headers.length||Math.max(...rows.map(r=>r.length)),18);
  const tableHeaders=(headers.length?headers:Array.from({length:maxCols},(_,i)=>i?'Колонка '+(i+1):'Показатель')).slice(0,maxCols);
  const groups=[];
  let current=null;
  rows.slice(0,160).forEach((row,idx)=>{
    const label=String(row[0]??'').trim()||('Строка '+(idx+1));
    const nums=row.slice(1,maxCols).map(v=>parseRuNumber(v));
    const hasNums=nums.some(v=>Number.isFinite(v)&&Math.abs(v)>0.000001);
    const looksChild=/^[-–—]/.test(label)||/январ|феврал|март|апрел|май|июн|июл|август|сентябр|октябр|ноябр|декабр/i.test(label);
    if(!current||(!looksChild&&hasNums&&current.children.length)){
      current={row,children:[]};
      groups.push(current);
    }else if(looksChild||current){
      current.children.push({row});
    }
  });
  let html=`<div class="raw-table-wrap"><table class="dt tree-table" id="${id}"><thead><tr>${tableHeaders.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>`;
  groups.forEach((g,gi)=>{
    const rowId=`${id}-${gi}`;
    html+=rawExpandableRow(g.row,tableHeaders,rowId,g.children.length>0,'tot');
    g.children.forEach(c=>{html+=rawExpandableRow(c.row,tableHeaders,rowId,false,`hidden-row ${rowId} lvl1`)});
  });
  return html+'</tbody></table></div>';
}
function rawExpandableRow(row,headers,rowId,hasToggle,cls){
  return `<tr class="${cls||''}">${headers.map((_,ci)=>{
    const v=row[ci];
    const prefix=ci===0&&hasToggle?`<span class="tree-toggle" onclick="toggleRows('${rowId}')">+</span>`:'';
    const n=parseRuNumber(v);
    const c=Number.isFinite(n)&&n<0?'dn':Number.isFinite(n)&&n>0?'up':'nt';
    return `<td class="${ci&&Number.isFinite(n)?c:''}">${prefix}${esc(formatRawCell(v))}</td>`;
  }).join('')}</tr>`;
}
function parseRuNumber(v){
  if(typeof v==='number')return v;
  const s=String(v??'').replace(/\s/g,'').replace(',','.');
  if(!s||/%|http|[A-Za-zА-Яа-я]/.test(s.replace(/[eE+-]/g,'')))return NaN;
  const n=Number(s);
  return Number.isFinite(n)?n:NaN;
}
function formatRawCell(v){
  if(typeof v==='number')return v.toLocaleString('ru-RU');
  return v??'';
}

function monthTrend(current,previous,prevLabel){

</div>
<div class="asec" data-reveal><h3>Раскрываемая таблица ОПиУ</h3>${expandableTable('pnl_tree',e2PnlSections())}</div>`;
  const wf=[revS,-vcS,revS-vcS,-sm(D.indirect),opS,-sm(D.interest),npS];

function renderCF(){
  const total=totalNcfSeries(),totalS=sl(total).reduce((s,v)=>s+(+v||0),0),opS=sm(D.ncf_op),invS=sm(D.ncf_inv),finS=sm(D.ncf_fin),divS=sm(D.dividends),i=li();

  <div class="kpi"><div class="kpi-label">Total NCF · период</div><div class="kpi-val">${F.$(totalS)}</div><div class="kpi-sub up">период ${F.$(totalS)} · ${D.months[i]}: ${F.$(metricMonth(total,i))}</div></div>
  <div class="kpi"><div class="kpi-label">NCF операционный · период</div><div class="kpi-val">${F.$(opS)}</div><div class="kpi-sub nt">${reportSub(D.ncf_op)}</div></div>
  <div class="kpi"><div class="kpi-label">NCF инвестиционный · период</div><div class="kpi-val">${F.$(invS)}</div><div class="kpi-sub dn">${reportSub(D.ncf_inv)}</div></div>
  <div class="kpi"><div class="kpi-label">NCF финансовый · период</div><div class="kpi-val">${F.$(finS)}</div><div class="kpi-sub dn">${reportSub(D.ncf_fin)}</div></div>
  <div class="kpi"><div class="kpi-label">Дивиденды · период</div><div class="kpi-val">${F.$(divS)}</div><div class="kpi-sub nt">${reportSub(D.dividends)}</div></div>
  <div class="kpi"><div class="kpi-label">Cash на конец периода</div><div class="kpi-val">${F.$(periodEnd(D.cash))}</div><div class="kpi-sub up">${D.months[i]} · period_end</div></div>
</div><div class="e2-row"><div class="card"><div class="card-title"><span class="dot" style="background:var(--green)"></span>NCF по блокам</div><div class="cw"><canvas id="c-cf"></canvas></div></div><div class="card"><div class="card-title"><span class="dot" style="background:var(--orange)"></span>Total NCF</div><div class="cw"><canvas id="c-total-ncf"></canvas></div></div><div class="card"><div class="card-title"><span class="dot" style="background:var(--accent)"></span>Cash at End of Month</div><div class="cw"><canvas id="c-cash-end"></canvas></div></div>${speakerBlock('cashflow_total_ncf','Заметки докладчика к ДДС','Объяснить, что общий денежный поток берется из Total NCF, а не только из трех верхних блоков. Cash показывается на конец выбранного периода.')}</div><div class="asec" data-reveal><h3>Раскрываемая таблица ДДС</h3>${expandableTable('cf_tree',e2CashflowSections())}</div>`;
  const m=gm();
  mc('c-cf',{type:'bar',data:{labels:m,datasets:[{label:'Опер.',data:sl(D.ncf_op),backgroundColor:'rgba(52,211,153,.45)'},{label:'Инвест.',data:sl(D.ncf_inv),backgroundColor:'rgba(167,139,250,.35)'},{label:'Фин.',data:sl(D.ncf_fin),backgroundColor:'rgba(248,113,113,.35)'}]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{stacked:true},y:{stacked:true}}}});
  mc('c-total-ncf',{type:'line',data:{labels:m,datasets:[{label:'Total NCF',data:sl(total),borderColor:'rgba(251,191,36,.85)',backgroundColor:'rgba(251,191,36,.12)',fill:true,tension:.25}]},options:{responsive:true,maintainAspectRatio:false}});
  mc('c-cash-end',{type:'line',data:{labels:m,datasets:[{label:'Cash end',data:sl(D.cash),borderColor:'rgba(34,211,238,.85)',backgroundColor:'rgba(34,211,238,.12)',fill:true,tension:.25}]},options:{responsive:true,maintainAspectRatio:false}});
}
function renderResults(){
  const links=(D.dashboard_links&&D.dashboard_links.length?D.dashboard_links:[
    {title:'Внедренность инструментов',url:C.TOOLS,description:'Отдельный дашборд по внедренности инструментов.'},
    {title:'Тайм-менеджмент и выполнение задач',url:'https://script.google.com/a/macros/rocketpeople.tech/s/AKfycbxTers8chtwgwkIh5cDNJI-9McA6Rj0GPSywQey0g3ygKqKSTaB9ZS8P2e5s7nopzWa/exec',description:'Отдельный дашборд выполнения задач.'}
  ]);
  const revS=sm(D.revenue),npS=sm(D.net_profit),opS=sm(D.op_profit),i=li(),npm=marginValue('np_margin_pct',revS?npS/revS*100:0);

    {m:'Рентабельность ЧП',v:F.pct(npm),s:npm<10?'alert':npm<15?'warning':'ok',t:npm<10?'Рентабельность ниже целевого уровня':'Рентабельность в рабочем коридоре',r:1},

    {m:'Маржинальность',v:F.pct(marginValue('margin_pct',0)),s:marginValue('margin_pct',0)<25?'alert':'ok',t:'Маржинальность в целевом коридоре',r:8},
    {m:'Кэш / дн. расходы',v:cashDays.toFixed(1)+' дн',s:cashDays<5?'alert':cashDays<15?'warning':'ok',t:cashDays<5?'Угроза кассового разрыва':'Буфер надо контролировать',r:11},
    {m:'Тек. ликвидность',v:D.current_ratio[i].toFixed(2),s:D.current_ratio[i]<1?'alert':D.current_ratio[i]<1.5?'warning':'ok',t:D.current_ratio[i]>=1.5?'Ликвидность в норме':'Ликвидность ниже нормы',r:16},
    {m:'Автономия',v:D.autonomy[i].toFixed(2),s:D.autonomy[i]<.2?'alert':D.autonomy[i]<.3?'warning':'ok',t:D.autonomy[i]<.3?'Критическая зависимость от заёмных средств':'Структура капитала приемлема',r:20},
    {m:'D/E',v:D.de_ratio[i].toFixed(2),s:D.de_ratio[i]>2.5?'alert':D.de_ratio[i]>1.5?'warning':'ok',t:D.de_ratio[i]>2.5?'Чрезмерный финансовый рычаг':'Долговая нагрузка под контролем',r:23},
    {m:'% кред./EBIT',v:F.pct(opS?sm(D.interest)/opS*100:0),s:opS&&sm(D.interest)/opS>.5?'alert':opS&&sm(D.interest)/opS>.3?'warning':'ok',t:'Процентная нагрузка приемлемая / требует контроля',r:28},
    {m:'Дивиденды/ЧП',v:F.pct(npS?sm(D.dividends)/npS*100:0),s:npS&&sm(D.dividends)/npS>1?'alert':npS&&sm(D.dividends)/npS>.7?'warning':'ok',t:'Проверить дивидендную политику',r:29},
    {m:'CRM-доля',v:F.pct(metricMonth(D.crm_pct,i)),s:metricMonth(D.crm_pct,i)>75?'alert':metricMonth(D.crm_pct,i)>60?'warning':'ok',t:'Критическая зависимость от базы',r:33},
    {m:'Трафик/выручка',v:F.pct(revS?sm(D.traffic_cost)/revS*100:0),s:revS&&sm(D.traffic_cost)/revS>.5?'alert':revS&&sm(D.traffic_cost)/revS>.4?'warning':'ok',t:'Давление трафиковых расходов',r:37},
    {m:'Фин. устойчивость',v:D.fin_stability[i].toFixed(2),s:D.fin_stability[i]<.6?'warning':'ok',t:'Финансовая устойчивость',r:32},
    {m:'DFL',v:D.dfl[i].toFixed(2),s:D.dfl[i]<0?'alert':'ok',t:D.dfl[i]<0?'Отрицательный рычаг':'Положительный рычаг',r:0}
  ];
  const cards=links.map(l=>`<div class="dash-link-card"><div><h4>${esc(l.title||l.name||'Дашборд')}</h4><p>${esc(l.description||l.comment||'Ссылка из Dashboard Config')}</p></div><a target="_blank" href="${esc(l.url||l.link||'#')}">Открыть дашборд</a></div>`).join('');
  document.getElementById('p-results').innerHTML=`<div class="asec" data-reveal><h3>Внешние результаты из Dashboard Config</h3><div class="link-grid">${cards}</div></div>
<div class="asec" data-reveal><h3>Целевые метрики и пороговые правила (${ths.length} правил)</h3><div class="th-grid">${ths.map(t=>`<div class="th-item ${t.s}"><div class="th-dot"></div><div><div class="th-lbl">${t.m}: ${t.v} ${t.r?'<span class="basis">#'+t.r+'</span>':''}</div><div class="th-txt">${t.t}</div></div></div>`).join('')}</div></div>${speakerBlock('results_targets','Заметки докладчика к результатам и целевым метрикам','Проговорить, какие метрики в норме, какие требуют управленческого решения.')}`;
}
function renderTech(){
  const reports=(D.raw_reports||[]).map(r=>[r.id,r.sheet_name,r.spreadsheet_name,r.rows,(r.matched_metrics||[]).join(', '),r.error||'']);
  const diag=((D.report_matches&&D.report_matches.length)?D.report_matches:D.metric_diagnostics||[]).map(r=>[r.metric,r.label||r.source_row,r.score,r.report,r.sheet]);
  const links=(D.dashboard_links||[]).map(l=>[l.title||l.name||'link',l.url||l.link||'',l.description||l.comment||'']);
  const errors=(D.report_errors||[]).slice().reverse().map(e=>[e]);
  document.getElementById('p-tech').innerHTML=`<div class="asec" data-reveal><h3>Тех. лист Edition 2</h3><p class="tech-note">Эта вкладка показывает источники, matching, период, ссылки и ошибки. Если ссылок на конкретные исходные Google Sheets нет в таблице reports, нужно доработать Apps Script proxy, чтобы он возвращал URL из Dashboard Config.</p></div>
<div class="tech-grid">
  <div class="asec"><h3>Dashboard Config / Reports</h3>${simpleTable(['report','sheet','file','rows','matched','error'],reports)}</div>
  <div class="asec"><h3>Metric matching</h3>${simpleTable(['metric','source row','score','report','sheet'],diag)}</div>
</div>
<div class="tech-grid">
  <div class="asec"><h3>Ссылки из Dashboard Config</h3>${simpleTable(['title','url','description'],links)}</div>
  <div class="asec"><h3>Ошибки proxy / источников</h3>${simpleTable(['newest first'],errors)}</div>
</div>
<div class="asec"><h3>Период</h3>${simpleTable(['month_key','label'],(D.month_keys||[]).map((k,i)=>[k,D.months[i]]))}</div>
${D.tech_sheet?`<div class="asec"><h3>Tech sheet raw</h3>${renderRawTable(D.tech_sheet,'tech_raw')}</div>`:''}`;
}
function simpleTable(headers,rows){
  if(!rows||!rows.length)return'<p class="tech-note">Нет данных</p>';
  return `<div class="raw-table-wrap"><table class="dt"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,80).map(r=>`<tr>${headers.map((_,i)=>`<td>${esc(r[i]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
