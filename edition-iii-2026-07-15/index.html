<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocket Finance Dashboard — Edition III</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
--bg:#0a0e17;--surface:rgba(17,24,39,.7);--surface2:#1a2332;
--border:#1e2d3d;--border-hover:rgba(34,211,238,.3);
--text:#e2e8f0;--text-muted:#64748b;--text-dim:rgba(100,116,139,.6);
--accent:#22d3ee;--accent-dim:rgba(34,211,238,.4);
--tab-active:#d8e2d0;--brand:#d8e2d0;--control:#9fb6a8;
--green:#34d399;--green-bg:rgba(52,211,153,.15);
--red:#f87171;--red-bg:rgba(248,113,113,.12);
--orange:#fb923c;--orange-bg:rgba(251,146,60,.12);
--yellow:#fbbf24;--purple:#a78bfa;--purple-bg:rgba(167,139,250,.12);
--cyan:#06b6d4;
}
body.theme-boardroom{
--bg:#0f1114;--surface:rgba(25,27,23,.82);--surface2:#24261f;
--border:#4c4630;--border-hover:rgba(245,158,11,.45);
--text:#f5f1e6;--text-muted:#a49b83;--text-dim:rgba(164,155,131,.68);
--accent:#f59e0b;--accent-dim:rgba(245,158,11,.42);
--tab-active:#f5f1e6;--brand:#e6b37a;--control:#d6c28c;
--green:#84cc16;--green-bg:rgba(132,204,22,.14);
--red:#fb7185;--red-bg:rgba(251,113,133,.13);
--orange:#f97316;--orange-bg:rgba(249,115,22,.14);
--yellow:#fde047;--purple:#c084fc;--purple-bg:rgba(192,132,252,.13);
--cyan:#eab308;
}
body.theme-clear{
--bg:#eef7f2;--surface:rgba(248,252,249,.62);--surface2:rgba(232,244,237,.72);
--border:#b8d6c5;--border-hover:rgba(14,116,144,.34);
--text:#10221b;--text-muted:#526b61;--text-dim:rgba(82,107,97,.64);
--accent:#0e7490;--accent-dim:rgba(14,116,144,.35);
--tab-active:#193a2e;--brand:#c95f58;--control:#3f6f61;
--green:#047857;--green-bg:rgba(4,120,87,.11);
--red:#be123c;--red-bg:rgba(190,18,60,.10);
--orange:#c2410c;--orange-bg:rgba(194,65,12,.11);
--yellow:#a16207;--purple:#7c3aed;--purple-bg:rgba(124,58,237,.10);
--cyan:#0891b2;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:#000}
body{font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:transparent;color:var(--text);min-height:100vh}
body,button,input,select,textarea,table,.kpi-val,.kpi-sub,.period-tag,.ds-badge,.section-meta{font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif!important}
#grass-bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;border:none;pointer-events:none;filter:hue-rotate(16deg) saturate(.82) brightness(.90)}
body.theme-boardroom #grass-bg{filter:hue-rotate(-14deg) saturate(.88) brightness(.84)}
body.theme-clear #grass-bg{opacity:.44;filter:hue-rotate(24deg) saturate(.72) brightness(1.12)}
/* AUTH */
#auth{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 30% 20%,rgba(167,139,250,.04) 0%,transparent 60%),rgba(10,14,23,.82)}
.auth-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:380px;text-align:center}
.auth-box h2{font-family:'Inter',system-ui,sans-serif;font-weight:800;font-size:28px;color:var(--brand);margin-bottom:8px}
.auth-box p{font-size:12px;color:var(--text-dim);margin-bottom:24px;letter-spacing:1px}
.auth-box input{width:100%;padding:12px 16px;background:rgba(15,25,15,.6);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;outline:none;margin-bottom:14px}
.auth-box input:focus{border-color:var(--accent-dim)}
.auth-box button{width:100%;padding:12px;background:rgba(167,139,250,.2);border:1px solid var(--border-hover);border-radius:10px;color:var(--control);font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.3px;text-transform:uppercase;transition:all .3s}
.auth-box button:hover{background:rgba(167,139,250,.35)}
.auth-err{color:var(--red);font-size:11px;margin-top:6px;display:none}
/* MAIN */
#app{position:relative;z-index:2;display:none;min-height:100vh}
.hdr{padding:18px 32px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100;background:rgba(10,14,23,.93)}
body.theme-boardroom .hdr{background:rgba(15,17,20,.96);border-bottom-color:rgba(245,158,11,.28)}
body.theme-clear .hdr{background:rgba(246,251,248,.95);border-bottom-color:rgba(14,116,144,.22)}
.hdr-left{display:flex;align-items:center;gap:14px}
.hdr h1{font-family:'Inter',system-ui,sans-serif;font-size:28px;font-weight:700;letter-spacing:0;display:flex;align-items:baseline;gap:4px}
.logo-rocket{color:var(--brand)}
.logo-dash{color:rgba(255,255,255,.4);font-size:28px;font-weight:300}
.hdr h1 em{font-style:italic;color:var(--text)}
.hdr .period-tag{font-size:10px;color:var(--text-dim);padding:4px 10px;border:1px solid var(--border);border-radius:6px;letter-spacing:.8px}
.hdr-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{height:34px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--control);font-size:11px;font-weight:700;cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:5px;white-space:nowrap;letter-spacing:.2px;text-transform:uppercase}
.btn:hover{border-color:var(--border-hover);color:var(--tab-active);background:var(--surface2)}
.btn-glow{background:rgba(167,139,250,.08);border-color:rgba(167,139,250,.18);color:var(--control)}
.btn-glow:hover{background:rgba(167,139,250,.16)}
.btn-live{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.20);color:var(--control)}
.sel{height:34px;padding:0 12px;background:rgba(15,25,15,.6);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:11px;font-weight:700;letter-spacing:.2px;outline:none;cursor:pointer}
.sel:focus{border-color:var(--accent-dim)}
.theme-select{width:112px}
.status{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.status.offline{background:var(--red);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* TABS */
.tabs{display:flex;gap:1px;padding:0 32px;border-bottom:1px solid var(--border);background:rgba(10,14,23,.92);overflow-x:auto;scrollbar-width:none}
body.theme-boardroom .tabs{background:rgba(12,13,12,.94)}
body.theme-clear .tabs{background:rgba(238,247,242,.94)}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 20px;font-size:14px;font-weight:700;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .3s;white-space:nowrap;letter-spacing:.3px;text-transform:uppercase}
.tab:hover{color:var(--text)}
.tab.active{color:var(--tab-active);border-bottom-color:var(--tab-active);text-shadow:none}
/* CONTENT */
.content{padding:20px 32px 60px;background:linear-gradient(180deg,rgba(10,14,23,.7) 0%,rgba(10,14,23,.5) 50%,rgba(10,14,23,.7) 100%);border-radius:0}
body.theme-boardroom .content{background:linear-gradient(180deg,rgba(12,12,10,.74),rgba(18,20,14,.52),rgba(12,12,10,.78))}
body.theme-clear .content{background:linear-gradient(180deg,rgba(238,247,242,.42),rgba(238,247,242,.28),rgba(238,247,242,.48))}
.pane{display:none}.pane.active{display:block}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:rgba(10,14,23,.22);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;padding:16px 18px;transition:all .4s;position:relative;overflow:hidden}
body.theme-boardroom .kpi{background:linear-gradient(145deg,rgba(37,32,23,.82),rgba(12,14,13,.66));border-radius:8px}
body.theme-clear .kpi{background:rgba(255,255,255,.42);border-radius:8px;box-shadow:0 10px 30px rgba(20,55,45,.08)}
.kpi:hover{border-color:var(--border-hover);background:var(--surface2);transform:translateY(-2px)}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent-dim);opacity:.4}
.kpi-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:8px}
.kpi-val{font-size:24px;font-weight:800;color:var(--text);margin-bottom:4px;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.up{color:var(--green)}.dn{color:var(--red)}.nt{color:var(--text-dim)}.wr{color:var(--orange)}
/* CHARTS */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px}
.card{background:rgba(10,14,23,.28);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:14px;padding:18px 20px;transition:border-color .3s;position:relative}
body.theme-boardroom .card,body.theme-boardroom .asec,body.theme-boardroom .speaker-block{background:rgba(28,29,19,.72);border-radius:8px;box-shadow:inset 0 1px 0 rgba(245,158,11,.08)}
body.theme-clear .card,body.theme-clear .asec,body.theme-clear .speaker-block{background:rgba(255,255,255,.42);border-radius:8px;box-shadow:0 12px 28px rgba(20,55,45,.08)}
.card:hover{border-color:var(--border-hover)}
.card.full{grid-column:1/-1}
.card-title{font-family:'Inter',system-ui,sans-serif;font-weight:600;font-size:15px;margin-bottom:12px;color:var(--text);display:flex;align-items:center;gap:8px}
.card-title .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.cw{position:relative;height:250px}.cw.tall{height:300px}.cw.short{height:180px}
.chart-caption{margin-top:10px;padding-top:9px;border-top:1px solid rgba(34,211,238,.10);font-size:12px;line-height:1.45;color:rgba(226,232,240,.72)}
.chart-caption b{color:rgba(210,252,248,.9);font-weight:600}
.kpi-norm{position:absolute;top:14px;right:14px;font-size:9px;color:rgba(215,230,190,.45)}
.kpi-formula{margin-top:6px;font-size:10px;line-height:1.35;color:rgba(100,116,139,.72)}
.e2-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:0}
.speaker-block{grid-column:1/-1;border:1px solid rgba(34,211,238,.24);background:rgba(10,22,24,.42);border-radius:14px;overflow:hidden;margin:12px 0 18px;backdrop-filter:blur(18px)}
.speaker-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(34,211,238,.14)}
.speaker-head strong{font-size:13px;color:rgba(210,252,248,.92)}
.speaker-head span{font-size:10px;color:var(--text-dim)}
.speaker-block.collapsed .speaker-body{display:none}
.speaker-body textarea{width:100%;min-height:128px;resize:vertical;border:0;background:rgba(3,8,12,.58);color:var(--text);font:500 13px/1.55 'Inter',system-ui,sans-serif;padding:14px;outline:none}
.speaker-actions{display:flex;justify-content:flex-end;gap:8px;padding:8px 10px;border-top:1px solid rgba(34,211,238,.12)}
.speaker-actions button{height:30px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);font-size:11px;font-weight:700;padding:0 10px;cursor:pointer}
.speaker-actions .save{background:var(--accent);color:#031216;border-color:var(--accent)}
.speaker-status{font-size:11px;color:var(--text-dim);margin-right:auto;align-self:center}
.link-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.dash-link-card{border:1px solid rgba(34,211,238,.24);background:rgba(10,28,31,.48);border-radius:14px;padding:16px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between}
.dash-link-card h4{font-size:17px;margin-bottom:8px}
.dash-link-card p{font-size:12px;color:var(--text-muted);line-height:1.55;margin-bottom:14px}
.dash-link-card a{display:flex;align-items:center;justify-content:center;height:36px;border-radius:8px;background:var(--accent);color:#041217;text-decoration:none;font-weight:800}
.tree-table .lvl1 td:first-child{padding-left:24px}.tree-table .lvl2 td:first-child{padding-left:42px;color:var(--text-muted)}
.tree-toggle{display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:5px;margin-right:6px;cursor:pointer;color:var(--accent)}
.hidden-row{display:none}
.tech-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tech-note{font-size:11px;color:var(--text-muted);line-height:1.55}
/* TABLES */
.tw{overflow-x:auto;margin-top:8px}
table.dt{width:100%;border-collapse:separate;border-spacing:0;font-size:11px;line-height:1.35;font-variant-numeric:tabular-nums}
table.dt th{background:rgba(13,28,25,.94);color:rgba(220,235,226,.78);font-weight:700;text-align:right;padding:9px 11px;border-bottom:1px solid rgba(159,182,168,.26);font-size:10px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;z-index:4}
table.dt th:first-child{text-align:left}
table.dt td{padding:8px 11px;text-align:left;border-bottom:1px solid rgba(159,182,168,.14);vertical-align:top;color:rgba(226,232,240,.86)}
table.dt td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.dt td.txt{text-align:left}
table.dt td:first-child,table.dt th:first-child{position:sticky;left:0;z-index:3;background:rgba(8,24,22,.94);box-shadow:1px 0 0 rgba(159,182,168,.20)}
table.dt th:first-child{z-index:5;background:rgba(10,29,25,.96)}
table.dt td:first-child{text-align:left;font-weight:650;color:var(--text);min-width:280px;max-width:380px}
body.theme-clear table.dt th{background:rgba(222,238,229,.82);color:#254136}
body.theme-clear table.dt td:first-child,body.theme-clear table.dt th:first-child{background:rgba(230,243,236,.88);box-shadow:1px 0 0 rgba(14,116,144,.16)}
body.theme-clear table.dt th:first-child{background:rgba(221,238,229,.92)}
body.theme-clear .source-section summary{background:rgba(230,243,236,.74);color:#163126}
body.theme-clear .source-section{background:rgba(255,255,255,.36)}
table.dt .cell-label{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25;white-space:normal}
table.dt tr.tot td{font-weight:700;border-top:2px solid var(--border);padding-top:8px}
table.dt tr:nth-child(even) td{background:rgba(255,255,255,.025)}
table.dt tr:hover td{background:rgba(159,182,168,.07)}
/* ANALYSIS */
.asec{background:rgba(10,14,23,.22);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;padding:24px 28px;margin-bottom:16px}
.asec h3{font-family:'Inter',system-ui,sans-serif;font-weight:600;font-size:18px;margin-bottom:14px;color:var(--text)}
.finding{margin-bottom:16px;padding-left:0}
.finding-num{font-size:11px;color:var(--accent);margin-right:6px}
.finding p{font-size:13px;line-height:1.7;color:var(--text);opacity:.85;margin-top:4px}
.finding .basis{font-size:10px;color:var(--text-dim);margin-top:4px;padding:4px 8px;background:rgba(15,25,15,.5);border:1px solid var(--border);border-radius:4px;display:inline-block}
.rtag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:600}
.rtag.hi{background:var(--red-bg);color:var(--red)}
.rtag.md{background:var(--orange-bg);color:var(--orange)}
.rtag.lo{background:var(--green-bg);color:var(--green)}
.rec{background:rgba(15,25,15,.5);border-left:3px solid var(--accent-dim);padding:14px 18px;margin-bottom:10px;border-radius:0 10px 10px 0;transition:border-color .3s}
.rec:hover{border-left-color:var(--accent)}
.rec h4{font-size:13px;font-weight:500;margin-bottom:3px;color:var(--text)}
.rec p{font-size:12px;color:var(--text-muted);margin:0}
.rec.urg{border-left-color:var(--red)}.rec.imp{border-left-color:var(--orange)}.rec.str{border-left-color:var(--purple)}
/* THRESHOLD */
.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:10px}
.th-item{background:rgba(15,25,15,.5);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px;border-left:3px solid var(--border);transition:all .3s}
.th-item:hover{background:rgba(20,35,20,.5)}
.th-item.alert{border-left-color:var(--red)}.th-item.warning{border-left-color:var(--orange)}.th-item.ok{border-left-color:var(--green)}
.th-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.th-item.alert .th-dot{background:var(--red)}.th-item.warning .th-dot{background:var(--orange)}.th-item.ok .th-dot{background:var(--green)}
.th-lbl{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px}
.th-txt{font-size:11px}
/* NOTES */
.note-btn{position:absolute;top:8px;right:10px;background:rgba(15,25,15,.6);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:10px;color:var(--text-dim);cursor:pointer;z-index:2;transition:all .2s}
.note-btn:hover{border-color:var(--accent-dim);color:var(--accent)}
.note-panel{display:none;position:absolute;top:30px;right:0;background:rgba(8,16,8,.95);border:1px solid var(--border);border-radius:10px;padding:12px 14px;width:300px;z-index:20;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.note-panel.open{display:block}
.note-entry{background:rgba(15,25,15,.5);border-radius:6px;padding:8px;margin-bottom:6px;border-left:2px solid var(--accent-dim)}
.note-form{display:flex;gap:6px;margin-top:8px}
.note-input{flex:1;padding:6px 8px;background:rgba(15,25,15,.6);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px;outline:none}
.note-submit{padding:6px 10px;background:rgba(167,139,250,.2);border:1px solid var(--border-hover);border-radius:6px;color:var(--accent);font-size:10px;font-weight:600;cursor:pointer}
/* DATA SOURCE BADGE */
.ds-badge{display:inline-flex;align-items:center;gap:5px;font-size:9px;color:var(--text-dim);background:rgba(15,25,15,.5);border:1px solid var(--border);border-radius:4px;padding:3px 8px;margin-bottom:10px}
.ds-badge.live{color:var(--green);border-color:rgba(52,211,153,.2)}
.ds-badge.demo{color:var(--orange);border-color:rgba(251,146,60,.2)}
.audit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.audit-card{border:1px solid var(--border);background:rgba(10,14,23,.24);border-radius:10px;padding:12px 14px}
.audit-card.ok{border-left:3px solid var(--green)}.audit-card.warn{border-left:3px solid var(--orange)}.audit-card.fail{border-left:3px solid var(--red)}
.audit-card h4{font-size:13px;margin-bottom:4px}.audit-card p{font-size:11px;line-height:1.5;color:var(--text-muted)}
body.theme-clear .audit-card{background:rgba(255,255,255,.65)}
/* RAW TABLE */
.raw-table-wrap{overflow-x:auto;max-height:620px;overflow-y:auto;background:rgba(4,12,10,.38);border-top:1px solid rgba(159,182,168,.16)}
.raw-table-wrap table.dt{font-size:10.5px}
body.theme-clear .raw-table-wrap{background:rgba(255,255,255,.28)}
body.theme-clear table.dt th{background:rgba(218,238,227,.88);color:#244036;border-bottom-color:rgba(63,111,97,.25)}
body.theme-clear table.dt td{color:#173128;border-bottom-color:rgba(63,111,97,.16)}
body.theme-clear table.dt tr:nth-child(even) td{background:rgba(255,255,255,.18)}
body.theme-clear .source-section{background:rgba(255,255,255,.30);border-color:rgba(63,111,97,.25)}
body.theme-clear .source-section summary{background:rgba(226,242,234,.78);color:#10221b}
body.theme-clear .dt tr.source-total td{background:rgba(120,132,116,.15);color:#10221b}
body.theme-clear .dt tr.source-subtotal td{background:rgba(120,132,116,.08);color:#10221b}
body.theme-clear .dt tr.source-child td:first-child,body.theme-clear .dt tr.source-grandchild td:first-child{color:#314d43}
.source-section{border:1px solid rgba(159,182,168,.24);border-radius:9px;background:rgba(8,20,16,.52);margin:12px 0;overflow:hidden}

let activePaneId='overview';
function tabsFromConfig(){
  const rows=(D.tech_sheet&&D.tech_sheet.Reports)||[];
  if(!rows.length)return TABS;
  const visibleIds=new Set();
  rows.forEach(r=>{
    const id=String(r['верхний_подвал']||r.report_id||r.id||'').trim();
    const visible=/^(true|1|yes|да|истина)$/i.test(String(r.visible||r.VISIBLE||''));
    if(visible&&id)visibleIds.add(id);
  });
  const tabs=TAB_MAP.filter(t=>t.always||t.ids.some(id=>visibleIds.has(id))).map(t=>({id:t.pane,label:t.label,v:true}));
  return tabs.length>=8?tabs:TABS;
}
function buildTabs(){
  const tb=document.getElementById('tabbar'),mn=document.getElementById('main');
  const tabs=tabsFromConfig().filter(t=>t.v);
  if(!tabs.some(t=>t.id===activePaneId))activePaneId=tabs[0]?.id||'overview';
  tb.innerHTML=tabs.map(t=>`<div class="tab${t.id===activePaneId?' active':''}" data-t="${t.id}">${t.label}</div>`).join('');
  mn.innerHTML=tabs.map(t=>`<div class="pane${t.id===activePaneId?' active':''}" id="p-${t.id}"></div>`).join('');
  tb.onclick=e=>{
    if(!e.target.classList.contains('tab'))return;
    activatePane(e.target.dataset.t);
  };
}
function activatePane(id){
  if(!id)return;
  const tab=document.querySelector(`.tab[data-t="${id}"]`);
  const pane=document.getElementById('p-'+id);
  if(!tab||!pane)return;
  activePaneId=id;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));

}
function handleHashNavigation(){

// ===== FORMAT =====
const F={
  $:v=>{v=+v||0;return Math.abs(v)>=1e6?'$'+(v/1e6).toFixed(2)+'M':Math.abs(v)>=1e3?'$'+(v/1e3).toFixed(0)+'K':'$'+v.toFixed(0)},
  pct:v=>{v=+v;return Number.isFinite(v)?(Math.abs(v)>0&&Math.abs(v)<.5?v.toFixed(1):v.toFixed(0))+'%':'—'},
  coef:v=>Number.isFinite(+v)?(+v).toFixed(1):'—',
  n:v=>(+v||0).toLocaleString('ru-RU'),
  k:v=>{v=+v||0;return Math.round(v/1000).toLocaleString('ru-RU')},
  trend:(c,p,lbl)=>{c=+c||0;p=+p||0;if(!p)return{t:'',c:'nt'};const d=((c-p)/Math.abs(p)*100);return{t:(d>=0?'↑':'↓')+Math.abs(d).toFixed(1)+'% к '+lbl,c:d>=0?'up':'dn'}}
};
function parseRuDate(v){
  if(v instanceof Date&&!isNaN(v))return v;
  const s=String(v||'').trim();
  const m=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);
  if(!m)return null;
  const y=+m[3]<100?2000+(+m[3]):+m[3];
  const d=new Date(y,+m[2]-1,+m[1]);
  return isNaN(d)?null:d;
}
const MONTH_SHORT=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const MONTH_LONG=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function monthIndex(m){
  const s=String(m||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]/g,'');
  if(!s)return -1;
  const num=parseInt(s,10);
  if(Number.isFinite(num)&&num>=1&&num<=12)return num-1;
  const ru=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const en=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  let idx=ru.findIndex(x=>s.startsWith(x));
  if(idx>=0)return idx;
  idx=en.findIndex(x=>s.startsWith(x));
  return idx;
}
function monthOrder(months){
  const seen=new Set(),items=[];
  (months||[]).forEach((m,old)=>{
    const idx=monthIndex(m);
    if(idx>=0&&!seen.has(idx)){seen.add(idx);items.push({old,idx})}
  });
  return items.sort((a,b)=>a.idx-b.idx);
}
function sanitizeMonths(months){
  const out=monthOrder(months).map(m=>MONTH_SHORT[m.idx]);
  return out.length?out:MONTH_SHORT.slice();
}
function parseMonthKey(key,label,old){
  const s=String(key||'').trim();
  const m=s.match(/^(\d{4})-(\d{1,2})/);
  if(m){
    const idx=+m[2]-1;
    if(idx>=0&&idx<12)return{old,idx,key:`${m[1]}-${String(+m[2]).padStart(2,'0')}`,label:MONTH_SHORT[idx],year:+m[1]};
  }
  const idx=monthIndex(label);
  return idx>=0?{old,idx,key:'legacy-'+old,label:MONTH_SHORT[idx],year:null}:null;
}
function usefulAt(d,pos,fields){
  return fields.some(f=>Array.isArray(d[f])&&Number.isFinite(+d[f][pos])&&Math.abs(+d[f][pos])>0.000001);
}
function buildSourceTimeline(d){
  const months=Array.isArray(d.months)?d.months:[];
  const keys=Array.isArray(d.month_keys)?d.month_keys:[];
  if(keys.length&&keys.length===months.length){
    const seen=new Set(),items=[];
    months.forEach((label,old)=>{
      const item=parseMonthKey(keys[old],label,old);
      if(!item||seen.has(item.key))return;
      seen.add(item.key);items.push(item);
    });
    let filtered=items;
    if(items.length>12){
      const yearCounts={};
      items.forEach(i=>{if(i.year)yearCounts[i.year]=(yearCounts[i.year]||0)+1});
      const year=Object.keys(yearCounts).sort((a,b)=>yearCounts[b]-yearCounts[a])[0];
      const sameYear=items.filter(i=>String(i.year)===String(year));
      if(sameYear.length>=2)filtered=sameYear;
    }
    return filtered.sort((a,b)=>a.key.localeCompare(b.key));
  }
  const seen=new Set(),items=[];
  months.forEach((label,old)=>{
    const idx=monthIndex(label);
    if(idx<0||seen.has(idx))return;
    // Старый proxy иногда отдает "Дек, Янв, Фев..." — первый Дек относится к прошлому году.
    if(old===0&&idx===11&&monthIndex(months[1])===0)return;
    seen.add(idx);
    const year=D.year||d.year||2026;
    items.push({old,idx,label:MONTH_SHORT[idx],key:`${year}-${String(idx+1).padStart(2,'0')}`,year});
  });
  return items.sort((a,b)=>a.idx-b.idx);
}

function usefulSeries(a){return Array.isArray(a)&&a.some(v=>Number.isFinite(+v)&&Math.abs(+v)>0.000001)}
function ratioLikeSeries(a){return Array.isArray(a)&&a.some(v=>Math.abs(+v)>0.000001)&&Math.max(...a.map(v=>Math.abs(+v||0)))<=5}
function normalizeData(){
  const n=Math.max(1,(D.months||[]).length);
  const hadMargin=usefulSeries(D.margin_pct),hadGross=usefulSeries(D.gross_margin_pct),hadOp=usefulSeries(D.op_margin_pct),hadNp=usefulSeries(D.np_margin_pct);
  DATA_FIELDS.forEach(f=>{
    if(!Array.isArray(D[f]))D[f]=[];
    D[f]=D[f].slice(0,n).map(v=>+v||0);
    if(COST_FIELDS.includes(f))D[f]=D[f].map(v=>Math.abs(v));
    if(PERCENT_FIELDS.includes(f)&&D[f].some(v=>Math.abs(v)>0.000001)&&Math.max(...D[f].map(v=>Math.abs(v)))<=1.5){
      D[f]=D[f].map(v=>+(v*100).toFixed(2));
    }
    while(D[f].length<n)D[f].push(0);
  });
  if(!hadGross&&D.revenue.some(v=>v>0)&&D.var_costs.some(v=>v>0)){
    D.gross_margin_pct=D.revenue.map((r,i)=>r?+(((r-D.var_costs[i])/r)*100).toFixed(2):0);
  }
  if(!hadMargin)D.margin_pct=D.gross_margin_pct.slice();
  if(D.revenue.some(v=>v>1000)&&ratioLikeSeries(D.var_costs)&&usefulSeries(D.margin_pct)){
    const pctMax=Math.max(...D.margin_pct.map(v=>Math.abs(+v||0)));
    D.var_costs=D.revenue.map((r,i)=>{
      const pct=pctMax<=1.5?(+D.margin_pct[i]||0)*100:(+D.margin_pct[i]||0);
      return Math.max(0,(+r||0)*(1-pct/100));
    });
  }
  if(!hadOp&&D.revenue.some(v=>v>0)&&D.op_profit.some(v=>v!==0)){
    D.op_margin_pct=D.revenue.map((r,i)=>r?+((D.op_profit[i]/r)*100).toFixed(2):0);
  }
  if(!hadNp&&D.revenue.some(v=>v>0)&&D.net_profit.some(v=>v!==0)){
    D.np_margin_pct=D.revenue.map((r,i)=>r?+((D.net_profit[i]/r)*100).toFixed(2):0);
  }
  const channelTotals=(D.months||[]).map((_,i)=>TRAFFIC_CHANNEL_FIELDS.reduce((s,f)=>s+Math.abs(+D[f][i]||0),0));
  if(channelTotals.some(v=>v>0)&&channelTotals.reduce((s,v)=>s+v,0)>Math.max(1,D.traffic_cost.reduce((s,v)=>s+Math.abs(+v||0),0))*5){
    D.traffic_cost=channelTotals;
  }
  hydrateTrafficFromRaw();
}
function hydrateTrafficFromRaw(){
  const rows=Array.isArray(D.traffic_data)?D.traffic_data:[];
  if(!rows.length||!Array.isArray(D.months))return;
  const totalCol=findTrafficTotalCol(rows);
  if(totalCol<0)return;
  const ftd=Array(D.months.length).fill(0);
  const dep=Array(D.months.length).fill(0);
  const traffic=Array(D.months.length).fill(0);
  rows.forEach(row=>{
    const label=String(row[0]||'').trim().toLowerCase();
    const monthIdx=monthIndexFromLabel(label);
    if(monthIdx<0||monthIdx>=D.months.length)return;
    const val=parseRuNumber(row[totalCol]);
    if(!Number.isFinite(val))return;
    if(label.includes('ftd'))ftd[monthIdx]=Math.abs(val);
    else if(label.includes('dep'))dep[monthIdx]=Math.abs(val);
    else if(/^трафик\s+/.test(label))traffic[monthIdx]=Math.abs(val);
  });
  if(ftd.some(v=>v>0)){
    D.ftd_total=ftd;
    if(!usefulSeries(D.ftd_new))D.ftd_new=ftd.slice();
  }
  if(dep.some(v=>v>0))D.dep_total=dep;
  if(traffic.some(v=>v>0)&&traffic.filter(v=>v>0).length>=2)D.traffic_cost=traffic;
}
function trafficSourceSummary(){
  const rows=Array.isArray(D.traffic_data)?D.traffic_data:[];
  const out={sources:[],rows:[],periodRows:[]};
  if(!rows.length)return out;
  let headerIdx=0,headerScore=-1;
  rows.slice(0,8).forEach((r,ri)=>{
    const score=(r||[]).filter(c=>/^(fb|google|тизерки|пп|tg ads|telegram|influence|стримеры|вип каналы|сторонние)$/i.test(String(c||'').trim())).length;
    if(score>headerScore){headerScore=score;headerIdx=ri}
  });
  const header=rows[headerIdx>=0?headerIdx:0]||[];
  const totalCol=findTrafficTotalCol(rows);
  const sourceCols=header.map((h,i)=>({name:String(h||'').trim(),i}))
    .filter(c=>c.i>0&&c.i!==totalCol&&/[A-Za-zА-Яа-яЁё]/.test(c.name)&&!/итого|total|ключевые|исходные|данные|источник/i.test(c.name));
  const metricDefs=[
    {key:'revenue',title:'Выручка',match:s=>/выручка.*выч|^выручка$|revenue/.test(s)},
    {key:'leads',title:'Лиды',match:s=>/^лиды$|leads/.test(s)},
    {key:'ftd',title:'FTD',match:s=>/ftd count|^ftd$/.test(s)},
    {key:'dep',title:'Dep count',match:s=>/dep count|deposit count/.test(s)},
    {key:'traffic',title:'Итого трафик',match:s=>/итого трафик|traffic total|^трафик$/.test(s)},
    {key:'margin',title:'Маржинальный доход',match:s=>/маржинальн.*доход|gross margin|margin income/.test(s)},
    {key:'margin_pct',title:'Рентабельность МД, %',match:s=>/рентабельность.*мд|рентабельность.*маржин|margin.*%/.test(s)},
    {key:'roi',title:'ROI',match:s=>/^roi|roi /.test(s)},
    {key:'arpu',title:'ARPU',match:s=>/arpu|выручка на 1/.test(s)},
    {key:'ltv',title:'LTV',match:s=>/^ltv/.test(s)},
    {key:'cac',title:'CAC',match:s=>/cac|стоимость ftd|стоимость dep/.test(s)},
    {key:'net_profit',title:'Чистая прибыль',match:s=>/чистая прибыль|net profit/.test(s)}
  ];
  const byMetric={};
  rows.forEach(r=>{
    const label=String(r&&r[0]||'').trim();
    const norm=label.toLowerCase();
    const def=metricDefs.find(d=>d.match(norm));
    if(def&&!byMetric[def.key])byMetric[def.key]={def,row:r,label};
  });
  out.sources=sourceCols.map(c=>{
    const item={source:c.name};
    Object.keys(byMetric).forEach(k=>{item[k]=parseRuNumber(byMetric[k].row[c.i]);});
    ['roi','margin_pct'].forEach(k=>{if(Number.isFinite(item[k])&&Math.abs(item[k])<=5)item[k]=item[k]*100});
    item.roi_calc=Number.isFinite(item.margin)&&Number.isFinite(item.traffic)&&Math.abs(item.traffic)>0.000001?item.margin/Math.abs(item.traffic)*100:NaN;
    item.arpu_calc=Number.isFinite(item.revenue)&&Number.isFinite(item.dep)&&Math.abs(item.dep)>0.000001?item.revenue/item.dep:NaN;
    item.cac_calc=Number.isFinite(item.traffic)&&Number.isFinite(item.ftd)&&Math.abs(item.ftd)>0.000001?Math.abs(item.traffic)/item.ftd:NaN;
    return item;
  }).filter(s=>Object.keys(s).some(k=>k!=='source'&&Number.isFinite(s[k])&&Math.abs(s[k])>0.000001));
  out.rows=out.sources.map(s=>[
    s.source,
    Math.round(s.revenue||0),
    Math.round(Math.abs(s.traffic||0)),
    Math.round(s.margin||0),
    +((Number.isFinite(s.roi)?s.roi:(s.roi_calc||0))).toFixed(1),
    Math.round(s.ftd||0),
    Math.round(s.dep||0),
    +((Number.isFinite(s.arpu)?s.arpu:(s.arpu_calc||0))).toFixed(1),
    +(Math.abs(Number.isFinite(s.cac)?s.cac:(s.cac_calc||0))).toFixed(1)
  ]);
  out.periodRows=metricDefs
    .filter(d=>byMetric[d.key])
    .map(d=>[d.title].concat(sourceCols.map(c=>formatRawCell(byMetric[d.key].row[c.i])).concat(totalCol>=0?[formatRawCell(byMetric[d.key].row[totalCol])]:[])));
  out.periodHeaders=['Показатель'].concat(sourceCols.map(c=>c.name)).concat(totalCol>=0?['Итого']:[]);
  return out;
}
function findTrafficTotalCol(rows){
  for(const row of rows.slice(0,8)){
    const idx=row.findIndex(c=>String(c||'').toLowerCase().includes('итого'));
    if(idx>=0)return idx;
  }
  return -1;
}
function monthIndexFromLabel(label){
  const n=String(label||'').toLowerCase().replace(/ё/g,'е');
  return MONTH_FULL.findIndex(m=>n.includes(m));
}
function hasDuplicateMonths(months){
  const seen=new Set();
  for(const m of months||[]){
    const idx=monthIndex(m);
    if(idx<0)continue;
    if(seen.has(idx))return true;
    seen.add(idx);
  }
  return false;
}

  });
  source.months=timeline.map(m=>m.label);
  source.month_keys=timeline.map(m=>m.key);
  return true;
}

function applyProxyPayload(d){
  if(!d||!d.ok)return 0;
  const fields=DATA_FIELDS;
  let acceptedFields=0;
  const sourceTimeline=buildSourceTimeline(d);
  if(d.year)D.year=d.year;
  const liveLen=sourceTimeline.length||(Array.isArray(d.months)?d.months.length:0);
  if(liveLen>0){
    fields.forEach(f=>{D[f]=Array(liveLen).fill(0)});
  }
  fields.forEach(f=>{
    if(Array.isArray(d[f])&&d[f].length>0&&d[f].some(v=>Number.isFinite(+v)&&Math.abs(+v)>0.000001)){
      D[f]=sourceTimeline.length?sourceTimeline.map(m=>+d[f][m.old]||0):d[f].map(v=>+v||0);
      acceptedFields++;
    }
  });
  if(sourceTimeline.length&&acceptedFields>0){D.months=sourceTimeline.map(m=>m.label);D.month_keys=sourceTimeline.map(m=>m.key);}
  else if(Array.isArray(d.months)&&d.months.length>0&&acceptedFields>0)D.months=sanitizeMonths(d.months);
  if(d.threshold_rules&&d.threshold_rules.length)D.thresholds=d.threshold_rules;
  if(d.notes&&d.notes.length)D.notes=d.notes;
  if(d.analysis)D.analysis=d.analysis;

  if(d.dashboard_links)D.dashboard_links=d.dashboard_links;

  if(d.pnl_data)D.pnl_data=d.pnl_data;
  if(d.pnl_combo)D.pnl_combo=d.pnl_combo;
  if(d.pnl_consol)D.pnl_consol=d.pnl_consol;

  return acceptedFields;

async function fetchData(){
  const hadCache=dataSource==='cache';
  if(!hadCache)show('Загрузка данных из Google Sheets...');
  else setStatus('обновляю Google Sheets...');
  try{
    const url=C.DATA_PROXY;
    if(!url||url==='APPS_SCRIPT_URL_PLACEHOLDER'){
      console.warn('Apps Script URL not configured, using reserve data');
      dataSource='reserve';
      render();hide();return;
    }
    if(C.FAST_LOAD){
      const core=await fetchProxyJson(url,'get_core').catch(()=>null);
      if(core&&core.ok){
        D.core_status={ok:true,mode:'get_core',message:'Быстрый слой get_core активен'};
        const coreFields=applyProxyPayload(core);
        dataSource=coreFields>0?'live':'cache';
        normalizeData();buildTabs();render();hide();
        document.getElementById('live-dot').classList.toggle('offline',coreFields===0);
        setStatus((coreFields>0?'быстрый обзор ':'получены только сырые данные ')+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+' · догружаю таблицы');
      }else{
        D.core_status={ok:false,mode:'fallback_get_all',message:core&&core.error?core.error:'get_core недоступен, используется get_all'};
      }
    }
    const d=await fetchProxyJson(url,'get_all');
    if(d&&d.ok){
      const acceptedFields=applyProxyPayload(d);
      dataSource=acceptedFields>0?'live':'cache';
      buildTabs();
      localStorage.setItem('rocket_data',JSON.stringify(D));
      localStorage.setItem('rocket_updated',new Date().toISOString());
      document.getElementById('live-dot').classList.toggle('offline',acceptedFields===0);
      setStatus((acceptedFields>0?'обновлено ':'получены только сырые данные ')+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}));
    }else{
      console.warn('Apps Script returned error:',d.error);
      dataSource='reserve';
      document.getElementById('live-dot').classList.add('offline');
      setStatus('⚠ proxy: '+String(d&&d.error||'ошибка').slice(0,70));
    }
  }catch(e){
    console.warn('Apps Script unavailable, using cached/reserve data:',e);
    dataSource=dataSource==='cache'?'cache':'reserve';
    document.getElementById('live-dot').classList.add('offline');
    setStatus('⚠ '+humanLoadError(e));
  }
  normalizeData();
  try{render()}finally{hide()}
}

function humanLoadError(e){
  const msg=String(e&&e.message||e||'ошибка загрузки');
  if(msg.includes('<!DOCTYPE')||msg.includes('HTML'))return 'proxy вернул HTML, нужен deploy Apps Script';
  if(msg.includes('aborted')||msg.includes('Abort'))return 'proxy не ответил вовремя';
  return 'ошибка загрузки ('+msg.slice(0,60)+')';
}
async function fetchProxyJson(baseUrl,action='get_all'){
  return await fetchProxyJsonp(baseUrl+'?action='+encodeURIComponent(action)+'&_='+Date.now());
}
function fetchProxyJsonp(requestUrl){
  return new Promise((resolve,reject)=>{
    const callback='__rocketProxyCb_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    const sep=requestUrl.includes('?')?'&':'?';
    const script=document.createElement('script');
    const timeout=setTimeout(()=>{
      cleanup();
      reject(new Error('JSONP timeout'));
    },180000);
    function cleanup(){
      clearTimeout(timeout);
      try{delete window[callback]}catch(e){window[callback]=undefined}
      if(script.parentNode)script.parentNode.removeChild(script);
    }
    window[callback]=data=>{cleanup();resolve(data)};
    script.onerror=()=>{cleanup();reject(new Error('JSONP load error'))};
    script.src=requestUrl+sep+'callback='+encodeURIComponent(callback);
    document.head.appendChild(script);
  });
}

function defaultUsefulRange(){
  // Cash is a balance snapshot and may be copied into future months; do not let it extend the default period.
  // Total NCF can appear for a partially filled current month before P&L is ready, so it should not expand the default period.
  const fields=['revenue','net_profit','op_profit'];
  const idxs=[];
  for(let i=0;i<(D.months||[]).length;i++){
    if(fields.some(f=>Array.isArray(D[f])&&Number.isFinite(+D[f][i])&&Math.abs(+D[f][i])>0.000001))idxs.push(i);
  }
  if(!idxs.length)return{from:0,to:Math.max(0,(D.months||[]).length-1)};
  return{from:idxs[0],to:idxs[idxs.length-1]};
}

// ===== CHARTS =====
const CH={};
function chartTick(v){
  v=+v||0;
  if(Math.abs(v)>=1000)return F.k(v)+'K';
  if(Math.abs(v)>0&&Math.abs(v)<1)return v.toFixed(1);
  return Math.round(v).toLocaleString('ru-RU');
}
function chartCaption(text){return `<div class="chart-caption">${text}</div>`}
function bestMonth(series,mode='max'){
  const vals=sl(series||[]);
  if(!vals.length)return '';
  const idx=vals.reduce((best,v,i)=>mode==='min'?(+v<+vals[best]?i:best):(+v>+vals[best]?i:best),0);
  return `${gm()[idx]||''} ${chartTick(vals[idx])}`;
}
const chartValueLabels={
  id:'valueLabels',
  afterDatasetsDraw(chart,args,pluginOptions){
    if(pluginOptions&&pluginOptions.display===false)return;
    const type=chart.config.type;
    if(type==='radar')return;
    const isRound=type==='doughnut'||type==='pie';
    if(isRound&&!(pluginOptions&&pluginOptions.displayRound))return;
    const {ctx,chartArea}=chart;
    ctx.save();
    ctx.font='600 9px Inter, system-ui, sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    chart.data.datasets.forEach((ds,di)=>{
      if(chart.isDatasetVisible&& !chart.isDatasetVisible(di))return;
      const meta=chart.getDatasetMeta(di);
      const dsType=ds.type||type;
      (meta.data||[]).forEach((el,i)=>{
        const raw=Array.isArray(ds.data)?ds.data[i]:null;
        const v=typeof raw==='object'&&raw!==null?(raw.y??raw.x):raw;
        if(!Number.isFinite(+v)||Math.abs(+v)<0.000001)return;
        const pos=el.tooltipPosition?el.tooltipPosition():el.getProps(['x','y'],true);
        if(pos.x<chartArea.left||pos.x>chartArea.right||pos.y<chartArea.top-10||pos.y>chartArea.bottom+10)return;
        const dsLabel=String(ds.label||'').toLowerCase();
        const isPct=dsLabel.includes('%')||/рент|марж|автон|доля/.test(dsLabel);
        const label=pluginOptions&&typeof pluginOptions.formatter==='function'
          ? pluginOptions.formatter(v,{chart,dataset:ds,datasetIndex:di,dataIndex:i})
          : (isPct?F.pct(Math.abs(+v)<=2?+v*100:+v):chartTick(+v));
        ctx.fillStyle=+v<0?'rgba(248,113,113,.92)':'rgba(226,232,240,.82)';
        const y=isRound?pos.y:(dsType==='line'?pos.y-12:(+v<0?pos.y+10:pos.y-10));
        ctx.fillText(label,pos.x,Math.max(chartArea.top+8,Math.min(chartArea.bottom-8,y)));
      });
    });
    ctx.restore();
  }
};
if(typeof Chart!=='undefined'&&Chart.register)Chart.register(chartValueLabels);
function applyChartDefaults(cfg){
  cfg.options=cfg.options||{};
  cfg.options.plugins=cfg.options.plugins||{};
  cfg.options.layout=cfg.options.layout||{};
  cfg.options.layout.padding=Object.assign({top:18,right:10,bottom:4,left:4},cfg.options.layout.padding||{});
  cfg.options.plugins.tooltip=cfg.options.plugins.tooltip||{};
  cfg.options.plugins.tooltip.callbacks=cfg.options.plugins.tooltip.callbacks||{};
  cfg.options.plugins.tooltip.callbacks.label=ctx=>{
    const parsed=ctx.parsed&&typeof ctx.parsed==='object'?(ctx.parsed.y??ctx.parsed.x??ctx.raw):ctx.parsed;
    return `${ctx.dataset.label?ctx.dataset.label+': ':''}${chartTick(parsed)}`;
  };
  if(!cfg.options.plugins.valueLabels)cfg.options.plugins.valueLabels={display:!['doughnut','pie','radar'].includes(cfg.type)};
  const scales=cfg.options.scales||{};
  Object.keys(scales).forEach(k=>{
    const s=scales[k]||{};
    s.ticks=s.ticks||{};
    if(!s.ticks.callback)s.ticks.callback=chartTick;
  });
  cfg.options.scales=scales;
  return cfg;
}
function mc(id,cfg){if(CH[id])CH[id].destroy();const c=document.getElementById(id);if(!c)return;CH[id]=new Chart(c,applyChartDefaults(cfg))}
Chart.defaults.color='rgba(215,230,190,.5)';Chart.defaults.borderColor='rgba(167,139,250,.08)';
Chart.defaults.font.family="'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";Chart.defaults.font.size=10;

// ===== NOTES =====
function noteBtn(cid){
  const notes=(D.notes||[]).filter(n=>n.chart_id===cid);const c=notes.length;
  return `<div class="note-btn" onclick="toggleNote('np-${cid}',event)">📝 ${c||'+'}</div>
<div class="note-panel" id="np-${cid}">
<div style="font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Примечания</div>
${notes.map(n=>`<div class="note-entry"><div style="font-size:9px;color:var(--accent-dim)">${n.month||''}</div><div style="font-size:11px;margin-top:2px">${n.text||''}</div></div>`).join('')}
<div class="note-form"><input class="note-input" id="ni-${cid}" placeholder="Добавить..." onkeydown="if(event.key==='Enter'){addNote('${cid}');event.preventDefault()}"><button class="note-submit" onclick="addNote('${cid}')">↵</button></div>
</div>`;
}
function toggleNote(id,e){e.stopPropagation();document.querySelectorAll('.note-panel.open').forEach(p=>{if(p.id!==id)p.classList.remove('open')});document.getElementById(id).classList.toggle('open')}
function addNote(cid){
  const inp=document.getElementById('ni-'+cid),txt=inp.value.trim();
  if(!txt)return;
  const note={chart_id:cid,month:new Date().toISOString().slice(0,7),text:txt};
  D.notes.push(note);inp.value='';
  if(!C.DEMO&&C.DATA_PROXY!=='APPS_SCRIPT_URL_PLACEHOLDER'){
    fetch(C.DATA_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'add_note',note})}).catch(()=>{});
  }
  render();
}
document.addEventListener('click',e=>{if(!e.target.closest('.note-panel')&&!e.target.closest('.note-btn'))document.querySelectorAll('.note-panel.open').forEach(p=>p.classList.remove('open'))});

// ===== DATA SOURCE BADGE =====
function dsBadge(src){
  const map={
    live:['live','● LIVE — Google Sheets'],
    cache:['live','◐ КЭШ — Google Sheets'],
    loading:['live','◌ Загрузка Google Sheets'],
    reserve:['demo','○ РЕЗЕРВ — ждёт Google Sheets']
  };
  const b=map[src]||map.loading;
  return `<div class="ds-badge ${b[0]}">${b[1]}</div>`;
}

// ===== INIT =====
function init(){
  applyTheme();
  try{
    const saved=localStorage.getItem('rocket_data');
    if(saved){Object.assign(D,JSON.parse(saved));dataSource='cache'}
    migrateCachedData();
    const upd=localStorage.getItem('rocket_updated');
    if(upd){const el=document.getElementById('updated-at');if(el)el.textContent='кэш '+new Date(upd).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
  }catch(e){}
  buildTabs();updatePeriodSelectors();render();
  if(!C.DEMO&&C.DATA_PROXY!=='APPS_SCRIPT_URL_PLACEHOLDER')fetchData();
}

// ===== RENDER ALL =====
function render(){
  normalizeData();
  document.getElementById('ptag').textContent=plbl();
  renderOverview();renderPnL();renderPnLCombo();renderPnLConsol();renderModel();
  renderCF();renderBalance();renderPayment();renderTraffic();renderCKP();
  renderResults();renderConclusions();renderTech();
  document.querySelectorAll('[data-reveal]:not(.revealed)').forEach(el=>{
    const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){el.classList.add('revealed');obs.unobserve(el)}})},{threshold:.1});
    obs.observe(el);
  });
  handleHashNavigation();
}

function paymentSummary(){
  const target=(D.months[li()]||'').toLowerCase();
  const out={planIn:0,factIn:0,planOut:0,factOut:0};
  const rows=Array.isArray(D.payment_data)?D.payment_data:[];
  if(rows.length<2)return out;
  const matrix=paymentSummaryFromMatrix(rows,monthIndex(D.months[li()]||''));
  if(matrix.found)return matrix;
  const headerIdx=findTableHeader(rows,[['месяц','month'],['сумма','usd','amount'],['факт','fact']],1);
  const hdr=(rows[headerIdx]||[]).map(h=>String(h||'').toLowerCase());
  const ci=(names)=>{for(const n of names){const i=hdr.findIndex(h=>h.includes(n));if(i>=0)return i;}return-1};
  const iMonth=ci(['месяц','month']);
  const iAmount=ci(['сумма','usd','amount']);
  const iFact=ci(['факт','fact']);
  rows.slice(headerIdx+1).forEach(r=>{
    const m=String(iMonth>=0?r[iMonth]:'').toLowerCase();
    if(target&&m&&!m.includes(target))return;
    const amount=parseRuNumber(iAmount>=0?r[iAmount]:0);
    if(!Number.isFinite(amount))return;
    const factAmount=iFact>=0?parseRuNumber(r[iFact]):NaN;
    const hasFact=Number.isFinite(factAmount)&&Math.abs(factAmount)>0.000001;
    if(amount>=0){out.planIn+=amount;if(hasFact)out.factIn+=Math.max(0,factAmount)}
    else{out.planOut+=Math.abs(amount);if(hasFact)out.factOut+=Math.abs(Math.min(0,factAmount))}
  });
  return out;
}
function paymentSummaryFromMatrix(rows,targetIdx){
  const out={planIn:0,factIn:0,planOut:0,factOut:0,found:false};
  if(targetIdx<0||rows.length<8)return out;
  const monthRow=rows[1]||[];
  const planFactRow=rows[5]||[];
  let totalStart=-1;
  monthRow.forEach((c,ci)=>{
    const s=String(c||'').toLowerCase();
    const mi=monthIndex(s)>=0?monthIndex(s):monthIndexFromLabel(s);
    if(s.includes('итого')&&mi===targetIdx)totalStart=ci;
  });
  if(totalStart<0)return out;
  const planCol=totalStart;
  let factCol=-1;
  for(let ci=totalStart;ci<Math.min(totalStart+8,planFactRow.length);ci++){
    if(/факт/i.test(String(planFactRow[ci]||''))){factCol=ci;break;}
  }
  const incomeRow=rows.find(r=>/^\s*поступления\s*$/i.test(String(r&&r[2]||'')));
  const expenseRow=rows.find(r=>/^\s*расходы\s*$/i.test(String(r&&r[2]||'')));
  if(incomeRow){
    out.planIn=Math.max(0,parseRuNumber(incomeRow[planCol])||0);
    out.factIn=Math.max(0,parseRuNumber(incomeRow[factCol])||0);
    out.found=true;
  }
  if(expenseRow){
    out.planOut=Math.abs(parseRuNumber(expenseRow[planCol])||0);
    out.factOut=Math.abs(parseRuNumber(expenseRow[factCol])||0);
    out.found=true;
  }
  return out;
}
function paymentFocusedTable(data,id){
  const rows=(data||[]).filter(r=>r&&r.some(c=>String(c??'').trim()!==''));
  if(rows.length<8)return rawTableToExpandable(data,id);
  const targetIdx=monthIndex(D.months[li()]||'');
  const labelIdx=2;
  const monthRow=rows[1]||[];
  const starts=[];
  monthRow.forEach((c,ci)=>{
    const mi=monthIndex(c);
    if(mi>=0)starts.push({ci,mi,label:String(c||'').trim()});
  });
  let startObj=starts.find(s=>s.mi===targetIdx);
  let end=rows[0]?.length||Math.max(...rows.map(r=>r.length));
  if(startObj){
    const next=starts.find(s=>s.ci>startObj.ci);
    end=next?next.ci:end;
  }
  let cols=[];
  if(startObj){
    cols=Array.from({length:Math.max(0,end-startObj.ci)},(_,k)=>startObj.ci+k)
      .filter(ci=>ci>labelIdx&&!isMostlyEmptyColumn(rows.slice(6),ci));
  }
  if(!cols.length){
    cols=paymentColumnsByDate(rows,targetIdx).filter(ci=>ci>labelIdx&&!isMostlyEmptyColumn(rows.slice(6),ci));
  }
  if(!cols.length)return rawTableToExpandable(data,id);
  const body=rows.slice(6).filter(r=>{
    const label=String(r[labelIdx]??sourceTitle(r)??'').trim();
    if(!label)return false;
    if(/^#REF!$/i.test(label))return false;
    return cols.some(ci=>String(r[ci]??'').trim()!==''&&!(Number.isFinite(parseRuNumber(r[ci]))&&Math.abs(parseRuNumber(r[ci]))<0.000001));
  }).slice(0,180);
  const headers=['Показатель',...cols.map(ci=>paymentColumnTitle(rows,ci,targetIdx))];

  html+=sourceRowsHtml(body,headers,id,labelIdx,cols);
  html+='</tbody></table></div></details>';
  return html;
}
function paymentColumnsByDate(rows,targetIdx){
  const cols=new Set();
  rows.slice(2,5).forEach(r=>{
    (r||[]).forEach((c,ci)=>{
      const d=parseDateLoose(c);
      if(d&&d.getMonth()===targetIdx){
        cols.add(ci);
        if(ci+1<(r||[]).length)cols.add(ci+1);
        if(ci+2<(r||[]).length)cols.add(ci+2);
      }
    });
  });
  return [...cols].sort((a,b)=>a-b);
}
function paymentColumnTitle(rows,ci,targetIdx){
  const raw=[
    rows[1]?.[ci],
    shortDateLabel(rows[2]?.[ci]),
    shortDateLabel(rows[3]?.[ci]),
    rows[5]?.[ci]
  ].map(v=>String(v??'').trim()).filter(Boolean);
  const type=String(rows[5]?.[ci]??'').trim();
  const start=shortDateLabel(rows[2]?.[ci]);
  const end=shortDateLabel(rows[3]?.[ci]);
  const month=raw.find(v=>monthIndex(v)>=0)||MONTH_LONG[targetIdx]||'Месяц';
  const datePart=start||end?`${start}${end&&end!==start?'–'+end:''}`:'';
  return esc([month,datePart,type].filter(Boolean).join(' · '));
}
function shortDateLabel(v){
  const d=parseDateLoose(v);
  if(!d)return '';
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});
}
function parseDateLoose(v){
  if(v instanceof Date&&!isNaN(v))return v;
  if(typeof v==='number'&&Number.isFinite(v)){
    const d=new Date(Math.round((v-25569)*86400*1000));
    return isNaN(d)?null:d;
  }
  const s=String(v??'').trim();
  if(!s)return null;
  const iso=new Date(s);
  if(!isNaN(iso))return iso;
  const m=s.match(/^(\d{1,2})[./-](\d{1,2})(?:[./-](\d{2,4}))?/);
  if(m){
    const year=m[3]?(+m[3]<100?2000+(+m[3]):+m[3]):2026;
    const d=new Date(year,+m[2]-1,+m[1]);
    return isNaN(d)?null:d;
  }
  return null;
}
function walletCashSummary(){
  const rows=Array.isArray(D.dds_operations_data)?D.dds_operations_data:[];
  const out={total:0,items:[],dateLabel:''};
  if(!rows.length)return out;
  const balanceRows=rows.slice(0,8).filter(r=>/остатк/i.test(String(r&&r[0]||'')));
  const totalRow=balanceRows.find(r=>/остатки всего/i.test(String(r[0]||'')))||balanceRows[0];
  if(totalRow){
    const direct=parseRuNumber(totalRow[2]);
    out.total=Number.isFinite(direct)?direct:0;
    const dt=totalRow.find(c=>String(c||'').includes('T')&&String(c||'').includes('Z'));
    if(dt){
      const d=new Date(dt);
      if(!isNaN(d))out.dateLabel='на '+d.toLocaleDateString('ru-RU');
    }
  }
  const byName={};
  balanceRows.forEach(row=>{
    for(let i=3;i<row.length-1;i++){
      const name=String(row[i]??'').trim();
      if(!name||/дата|курс|остатки|итого|месяц/i.test(name))continue;
      if(!/[A-Za-zА-Яа-яЁё]/.test(name))continue;
      const value=parseRuNumber(row[i+1]);
      if(!Number.isFinite(value))continue;
      byName[name]=(byName[name]||0)+value;
      i++;
    }
  });
  out.items=Object.keys(byName).map(name=>({name,value:byName[name]}))
    .filter(w=>Math.abs(w.value)>0.000001)
    .sort((a,b)=>Math.abs(b.value)-Math.abs(a.value));
  if(!out.total&&out.items.length)out.total=out.items.reduce((s,w)=>s+w.value,0);
  return out;
}

function ckpChartRows(rows){
  return (rows||[])
    .map(r=>({...r,lastValue:+(r.values||[])[li()]||0,spread:seriesSpread(sl(r.values||[]))}))
    .filter(r=>usefulSeries(r.values)&&Number.isFinite(r.lastValue)&&Math.abs(r.lastValue)>0.000001)
    .sort((a,b)=>Math.abs(b.lastValue)-Math.abs(a.lastValue)||b.spread-a.spread);
}
function seriesSpread(values){
  const nums=(values||[]).map(v=>+v).filter(Number.isFinite);
  if(!nums.length)return 0;
  return Math.max(...nums)-Math.min(...nums);
}
function trendText(values){
  const s=sl(values||[]).map(v=>+v||0);
  if(s.length<2)return 'нет сравнения';
  const first=s.find(v=>Math.abs(v)>0.000001);
  const last=s[s.length-1]||0;
  if(first===undefined)return 'нет динамики';
  const diff=last-first;
  if(Math.abs(diff)<0.000001)return 'без изменений';
  return `${diff>0?'↑':'↓'} ${F.n(Math.round(Math.abs(diff)))}`;
}
function shortLabel(text,max=30){
  const s=String(text||'').replace(/\s+/g,' ').trim();
  return s.length>max?s.slice(0,max-1).trim()+'…':s;
}
function ckpBlocks(data){
  const periodIdx=(data||[]).findIndex(r=>(r||[]).some(c=>/период|period/i.test(String(c||''))));
  const rows=data.slice((periodIdx>=0?periodIdx:0)+1).filter(r=>r&&r.some(c=>c!==''&&c!==null&&c!==undefined));
  const periodRow=periodIdx>=0?data[periodIdx]:[];
  const ckpMonthCols=periodRow.map((c,ci)=>{
    const d=new Date(c);
    if(!isNaN(d))return{ci,mi:d.getMonth()};
    const mi=monthIndex(c);
    return mi>=0?{ci,mi}:null;
  }).filter(Boolean);
  const firstDashMonth=monthIndex((D.months||[])[0]);
  const firstSourceMonth=ckpMonthCols.length?ckpMonthCols[0].mi:-1;
  const orderOffset=ckpMonthCols.length&&firstDashMonth>=0&&firstSourceMonth>=0
    ? ((firstDashMonth-firstSourceMonth+12)%12)
    : 0;
  const firstValueCol=2;
  const orderedMonthCols=(D.months||[]).map((_,mi)=>firstValueCol+orderOffset+mi);
  const activeCols=orderedMonthCols.map((ci,mi)=>{
    if(periodRow[ci]!==undefined)return ci;
    const hit=ckpMonthCols.find(x=>x.mi===mi);
    return hit?hit.ci:null;
  });
  const blocks=[];
  let current=null;
  rows.slice(0,180).forEach(r=>{
    const first=String(r[0]??'').trim();
    const second=String(r[1]??'').trim();
    if(/^цкп\s*\d+/i.test(first)){
      current={title:`${first} — ${second||'без названия'}`,shortTitle:first,rows:[]};
      blocks.push(current);
      return;
    }
    if(!current)return;
    if(!/^критерии$/i.test(first))return;
    const label=second||first;
    if(!label||/период/i.test(label))return;
    const values=activeCols.map(ci=>ci==null?0:parseRuNumber(r[ci])).map(v=>Number.isFinite(v)?v:0);
    const rawLast=activeCols[li()]!=null?r[activeCols[li()]]:'';
    const nums=values.filter(v=>Number.isFinite(v)&&Math.abs(v)>0.000001);
    const avg=nums.length?nums.reduce((s,v)=>s+v,0)/nums.length:0;
    current.rows.push({
      label,
      values,
      display:ckpDisplayValue(rawLast,label),
      avgDisplay:ckpDisplayValue(avg,label)
    });
  });
  return blocks.filter(b=>b.rows.length).slice(0,12);
}
function ckpDisplayValue(v,label){
  const n=parseRuNumber(v);
  if(!Number.isFinite(n))return String(v||'');
  if(isPercentLabel(label))return F.pct(Math.abs(n)<=2?n*100:n);
  if(isCoeffLabel(label))return `${F.coef(n)}×`;
  if(isCountLabel(label))return `${F.n(n)} шт.`;
  if(Math.abs(n)>=1000)return `${F.k(n)} тыс.`;
  if(/дн|day/i.test(label))return `${F.n(Math.round(n))} дн.`;
  return Math.abs(n)>0&&Math.abs(n)<10?`${F.coef(n)} ед.`:`${F.n(Math.round(n))} ед.`;
}

function findTableHeader(rows, groups, minScore=2){
  let best={idx:0,score:-1};
  (rows||[]).forEach((row,idx)=>{
    const hdr=(row||[]).map(h=>String(h||'').toLowerCase().trim());
    let score=0;
    groups.forEach(names=>{if(names.some(n=>hdr.some(h=>h.includes(n))))score++});
    if(score>best.score)best={idx,score};
  });
  return best.score>=minScore?best.idx:0;
}

  if(D.tasks_data&&Array.isArray(D.tasks_data)&&D.tasks_data.length>1){
    const rows=D.tasks_data;
    const headerIdx=findTableHeader(rows,[
      ['задач','наименов','название','task','name'],
      ['статус','status','состо'],
      ['ответств','owner','исполн','сотрудн'],
      ['срок','дедлайн','deadline','план','дата план']
    ]);
    // Ищем индексы по НАЗВАНИЮ заголовка, а не по позиции (защита от перестановки столбцов и служебных строк сверху)
    const hdr=rows[headerIdx].map(h=>String(h||'').toLowerCase().trim());
    const ci=(names)=>{for(const n of names){const i=hdr.findIndex(h=>h.includes(n));if(i>=0)return i;}return-1};
    const iName=ci(['задач','наименов','название','task','name']);
    const iStat=ci(['статус','status','состо']);
    const iOwn=ci(['ответств','owner','исполн','сотрудн']);
    const iDead=ci(['дата план','срок','дедлайн','deadline','план']);
    const iFact=ci(['дата факт','факт']);
    const dataRows=rows.slice(headerIdx+1).filter(r=>{
      const name=(iName>=0?r[iName]:r[0]);
      return String(name||'').trim()&&r.some(c=>c!==''&&c!==null&&c!==undefined);
    });
    html+=`<div style="margin-bottom:12px">`;
    dataRows.slice(0,50).forEach(r=>{
      const name=(iName>=0?r[iName]:r[0])||'—';
      const rawSt=String(iStat>=0?r[iStat]:r[2]||'').toLowerCase();
      let cls='todo',lbl='Не начато';
      if(rawSt.includes('выполн')||rawSt.includes('done')||rawSt.includes('завер')||rawSt.includes('готов'))cls='done',lbl='Выполнено';
      else if(rawSt.includes('работ')||rawSt.includes('wip')||rawSt.includes('прогресс')||rawSt.includes('в процесс'))cls='wip',lbl='В работе';
      else if(rawSt.includes('просроч')||rawSt.includes('late')||rawSt.includes('задерж')||rawSt.includes('перенос'))cls='late',lbl='Просрочено';
      else if(iDead>=0&&!r[iFact]&&parseRuDate(r[iDead])&&parseRuDate(r[iDead])<new Date())cls='late',lbl='Просрочено';
      const owner=iOwn>=0?r[iOwn]:'';
      const dead=iDead>=0?r[iDead]:'';
      html+=`<div class="task-item"><span class="task-status ${cls}">${lbl}</span><span class="pay-name">${name}</span>${owner?`<span style="font-size:10px;color:var(--text-dim);margin-left:8px">${owner}</span>`:''}${dead?`<span style="font-size:10px;color:var(--accent-dim);margin-left:8px">${dead}</span>`:''}</div>`;
    });
    if(dataRows.length>50)html+=`<p style="font-size:10px;color:var(--text-dim);margin-top:8px">...и ещё ${dataRows.length-50} задач</p>`;
    html+=`</div>`;
    // Сводная диаграмма статусов
    const stats={done:0,wip:0,late:0,todo:0};
    dataRows.forEach(r=>{const s=String(iStat>=0?r[iStat]:r[2]||'').toLowerCase();if(s.includes('выполн')||s.includes('done')||s.includes('завер')||s.includes('готов'))stats.done++;else if(s.includes('просроч')||s.includes('late')||(iDead>=0&&!r[iFact]&&parseRuDate(r[iDead])&&parseRuDate(r[iDead])<new Date()))stats.late++;else if(s.includes('работ')||s.includes('wip')||s.includes('прогресс'))stats.wip++;else stats.todo++;});
    html+=`</div><div class="card" style="max-width:360px;margin-top:16px" data-reveal><div class="card-title"><span class="dot" style="background:var(--green)"></span>Статусы задач</div><div class="cw short"><canvas id="c-tasks-status"></canvas></div></div>`;
    document.getElementById('p-tasks').innerHTML=html;
    mc('c-tasks-status',{type:'doughnut',data:{labels:['Выполнено '+stats.done,'В работе '+stats.wip,'Просрочено '+stats.late,'Не начато '+stats.todo],datasets:[{data:[stats.done,stats.wip,stats.late,stats.todo],backgroundColor:['rgba(52,211,153,.5)','rgba(251,146,60,.5)','rgba(248,113,113,.5)','rgba(100,116,139,.3)'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:10}}}},cutout:'50%'}});
    return;
  } else {
    html+=`<p style="color:var(--text-dim);font-size:12px">Источник: Дорожная карта Rocket Project 2026 — лист «свод по задачам».<br>Статусы: выполнено / в работе / просрочено / не начато.</p>`;
  }
  html+=`</div>`;
  document.getElementById('p-tasks').innerHTML=html;
}

// ===== HELPER: RENDER RAW TABLE FROM 2D ARRAY =====
function esc(v){
  return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function renderRawTable(data,id,headerGroups){
  if(!data||!data.length)return'';
  const headerIdx=headerGroups?findTableHeader(data,headerGroups,1):0;
  const headers=data[headerIdx];
  const rows=data.slice(headerIdx+1).filter(r=>r.some(c=>c!==''&&c!==null&&c!==undefined));
  if(!rows.length)return'<p style="color:var(--text-dim);font-size:11px">Нет данных</p>';
  let html=`<div class="raw-table-wrap"><table class="dt" id="${id}"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>`;
  rows.slice(0,100).forEach(r=>{
    const rowLabel=sourceTitle(r);
    html+=`<tr>${headers.map((_,ci)=>{
      const v=r[ci];
      if(v===null||v===undefined||v==='')return`<td></td>`;
      const n=parseRuNumber(v);
      if(Number.isFinite(n)&&v!==''){
        const cls=n<0?'dn':n>0?'':'nt';
        return`<td class="num ${cls}">${formatTableNumber(n,rowLabel)}</td>`;
      }
      return ci===0?`<td class="txt" title="${esc(String(v??''))}">${labelText(v)}</td>`:`<td class="txt">${esc(v)}</td>`;
    }).join('')}</tr>`;
  });
  if(rows.length>100)html+=`<tr><td colspan="${headers.length}" style="color:var(--text-dim);text-align:center">...и ещё ${rows.length-100} строк</td></tr>`;
  html+=`</tbody></table></div>`;
  return html;
}
function rawTableToExpandable(data,id,headerGroups){
  if(!data||!data.length)return'';
  const split=/projects|ludens|combo|consol|ckp/i.test(String(id||''));
  return sourceOutlineTable(data,id,{headerGroups,split});
}
function rawExpandableRow(row,headers,rowId,hasToggle,cls){
  return `<tr class="${cls||''}">${headers.map((_,ci)=>{
    const v=row[ci];
    const prefix=ci===0&&hasToggle?`<span class="tree-toggle" onclick="toggleRows('${rowId}')">+</span>`:'';
    const n=parseRuNumber(v);
    const c=Number.isFinite(n)&&n<0?'dn':Number.isFinite(n)&&n>0?'up':'nt';
    return `<td class="${ci&&Number.isFinite(n)?c:''}">${prefix}${esc(formatRawCell(v))}</td>`;
  }).join('')}</tr>`;
}

function sourceSections(data,opts={}){

    const headerIdx=opts.headerGroups?findTableHeader(rows,opts.headerGroups,1):findBestSourceHeader(rows);
    const header=rows[headerIdx]||rows[0]||[];
    const meta=rows.slice(Math.max(0,headerIdx-3),headerIdx);
    const body=rows.slice(headerIdx+1);
    return [{title:opts.title||sourceDefaultTitle(idFromOpts(opts),rows[0]),header,meta,rows:body}].filter(s=>s.rows&&s.rows.length);
  }
  const sections=[];
  let i=0;
  while(i<rows.length){
    if(isSourceSectionStart(rows[i],rows[i+1])){
      const title=sourceTitle(rows[i]);
      const header=rows[i+1];
      const meta=[rows[i]];
      const body=[];
      i+=2;
      while(i<rows.length&&!isSourceSectionStart(rows[i],rows[i+1])){
        if(!isMonthHeaderRow(rows[i]))body.push(rows[i]);
        i++;
      }
      sections.push({title,header,meta,rows:body});
    }else{
      const headerIdx=opts.headerGroups?findTableHeader(rows,opts.headerGroups,1):0;
      const header=rows[headerIdx]||[];
      const meta=rows.slice(Math.max(0,headerIdx-3),headerIdx);
      const body=rows.slice(headerIdx+1).filter(r=>!isMonthHeaderRow(r));
      sections.push({title:opts.title||sourceDefaultTitle(idFromOpts(opts),rows[0]),header,meta,rows:body});

function expandableTable(id,sections){
  const idxs=tableMonths();
  const head=idxs.map(i=>`<th>${esc(D.months[i]||'')}</th>`).join('')+'<th>ИТОГО</th>';
  let html=`<div class="raw-table-wrap"><table class="dt tree-table" id="${id}"><thead><tr><th>Показатель</th>${head}</tr></thead><tbody>`;
  sections.forEach((s,si)=>{
    const rowId=`${id}-${si}`;
    const children=(s.children||[]).filter(c=>usefulSeries(c.values));
    const vals=idxs.map(i=>+s.values[i]||0);
    const sum=vals.reduce((a,b)=>a+b,0);
    const toggle=children.length?`<span class="tree-toggle" onclick="toggleRows('${rowId}')">+</span>`:'';
    html+=`<tr class="tot"><td title="${esc(s.title)}">${toggle}${labelText(s.title)}</td>${vals.map(v=>`<td class="num ${v<0?'dn':v>0?'up':'nt'}">${formatTableNumber(v,s.title)}</td>`).join('')}<td class="num ${sum<0?'dn':'up'}">${formatTableNumber(sum,s.title)}</td></tr>`;
    children.forEach(c=>{
      const cv=idxs.map(i=>+c.values[i]||0);
      const csum=cv.reduce((a,b)=>a+b,0);
      html+=`<tr class="hidden-row ${rowId} lvl1"><td title="${esc(c.title)}">${labelText(c.title)}</td>${cv.map(v=>`<td class="num ${v<0?'dn':v>0?'up':'nt'}">${formatTableNumber(v,c.title)}</td>`).join('')}<td class="num ${csum<0?'dn':'up'}">${formatTableNumber(csum,c.title)}</td></tr>`;
    });
  });
  return html+'</tbody></table></div>';
}

function toggleSourceRows(id){
  const btn=document.querySelector('[data-source-toggle="'+id+'"]');
  const open=btn&&!btn.classList.contains('is-open');
  if(btn){btn.classList.toggle('is-open',open);btn.textContent=open?'−':'+'}
  document.querySelectorAll('[data-source-parent="'+id+'"]').forEach(el=>{

  const perf=D.performance?[['mode',D.performance.mode],['duration_ms',D.performance.duration_ms],['sources_read',D.performance.sources_read],['generated_at',D.performance.started_at||D.performance.generated_at||'']]:[];
  const audit=controlAudit();
  document.getElementById('p-tech').innerHTML=`<div class="asec" data-reveal><h3>Тех. лист Edition 2</h3><p class="tech-note">Эта вкладка показывает Dashboard Config, загруженные источники, matching, период, ссылки и ошибки. Ссылки берутся из Dashboard Config и отображаются как активные URL.</p></div>
<div class="asec"><h3>Контроль готовности</h3>${auditCards(audit)}</div>
<div class="asec"><h3>Dashboard Config / Reports</h3>${objectTable(configReports,['верхний_подвал','sheet_id','sheet_name','visible','order','build_chart','use_in_analysis','description'])}</div>
<div class="tech-grid">
  <div class="asec"><h3>Загруженные источники</h3>${simpleTable(['report','sheet','file','source url','rows','matched','error'],reports)}</div>
  <div class="asec"><h3>Metric matching</h3>${simpleTable(['metric','source row','score','report','sheet'],diag)}</div>
</div>
<div class="tech-grid">
  <div class="asec"><h3>Вкладки из Dashboard Config</h3>${simpleTable(['pane','label'],tabs)}</div>
  <div class="asec"><h3>ЦКП audit / скорость</h3>${simpleTable(['metric','value'],[['source',ckp.source],['blocks',ckp.blocks],['criteria',ckp.criteria],['chart_series',ckp.series],['source_rows',ckp.sourceRows],...perf])}</div>
</div>
<div class="tech-grid">
  <div class="asec"><h3>Ссылки из Dashboard Config</h3>${simpleTable(['title','url','description'],links)}</div>
  <div class="asec"><h3>Ошибки proxy / источников</h3>${simpleTable(['newest first'],errors)}</div>
</div>
<div class="asec"><h3>Период</h3>${simpleTable(['month_key','label'],(D.month_keys||[]).map((k,i)=>[k,D.months[i]]))}</div>
<div class="tech-grid">
  <div class="asec"><h3>Threshold Rules</h3>${objectTable(thresholds)}</div>
  <div class="asec"><h3>Notes / служебные примечания</h3>${objectTable(configNotes)}</div>
</div>`;
}
function controlAudit(){
  const theme=localStorage.getItem('rocket_theme')||'executive';
  const tabs=tabsFromConfig().filter(t=>t.v);
  return [
    {name:'Данные Google Sheets',state:dataSource==='live'?'ok':'warn',detail:dataSource==='live'?'LIVE получен':'используется кэш/fallback'},
    {name:'13 вкладок',state:tabs.length===13?'ok':'warn',detail:`найдено вкладок: ${tabs.length}`},
    {name:'Визуальные схемы',state:['executive','boardroom','clear'].includes(theme)?'ok':'warn',detail:`активна: ${theme}. Boardroom и Clear меняют не только цвет, но фон, карточки и плотность.`},
    {name:'get_core',state:D.core_status&&D.core_status.ok?'ok':'warn',detail:D.core_status?D.core_status.message:'не проверен'},
    {name:'Заметки докладчика',state:(D.speaker_notes||[]).length?'ok':'warn',detail:`загружено/создано заметок: ${(D.speaker_notes||[]).length}. Кнопка сохранения показывает статус.`},
    {name:'Raw-таблицы',state:(D.pnl_data&&D.dds_data&&D.balance_data)?'ok':'warn',detail:`ОПиУ ${D.pnl_data?D.pnl_data.length:0}, ДДС ${D.dds_data?D.dds_data.length:0}, баланс ${D.balance_data?D.balance_data.length:0} строк`},
    {name:'Трафик',state:D.traffic_data?'ok':'warn',detail:D.traffic_data?`строк источника: ${D.traffic_data.length}`:'источник не загружен'},
    {name:'ЦКП',state:ckpBlocks(D.ckp_data||[]).length>=6?'ok':'warn',detail:`блоков: ${ckpBlocks(D.ckp_data||[]).length}`}
  ];
}
function auditCards(items){
  return `<div class="audit-grid">${items.map(it=>`<div class="audit-card ${it.state}"><h4>${esc(it.name)}</h4><p>${esc(it.detail)}</p></div>`).join('')}</div>`;
}
function simpleTable(headers,rows){
  if(!rows||!rows.length)return'<p class="tech-note">Нет данных</p>';
  return `<div class="raw-table-wrap"><table class="dt"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,80).map(r=>`<tr>${headers.map((h,i)=>smartCell(r[i]??'',i,h)).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function objectTable(rows,preferred){
  if(!rows||!rows.length)return'<p class="tech-note">Нет данных</p>';
  const keys=preferred&&preferred.length?preferred:Object.keys(rows[0]||{});
  return `<div class="raw-table-wrap"><table class="dt"><thead><tr>${keys.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,120).map(r=>`<tr>${keys.map((k,i)=>smartCell(r&&r[k]!==undefined?r[k]:'',i,k)).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function smartCell(v,ci=0,label=''){
  const n=parseRuNumber(v);
  const cls=Number.isFinite(n)?`num ${n<0?'dn':n>0?'up':'nt'}`:'txt';
  if(Number.isFinite(n))return `<td class="${cls}">${formatTableNumber(n,label)}</td>`;
  return `<td class="${cls}" title="${esc(String(v??''))}">${ci===0?labelText(v):linkCell(v)}</td>`;
}
function linkCell(v){
  const text=String(v??'');
  if(/^https?:\/\//i.test(text))return `<a href="${esc(text)}" target="_blank" style="color:var(--accent);text-decoration:underline">${esc(shortUrl(text))}</a>`;
  return esc(text);
}
function shortUrl(v){
  return String(v||'').replace(/^https?:\/\//,'').slice(0,64)+(String(v||'').length>72?'...':'');
}

// ===== AUTO INIT =====
if(C.DEMO){document.getElementById('auth').style.display='none';document.getElementById('app').style.display='block';init()}
